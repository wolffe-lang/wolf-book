# wolf-lang at trunk `3103577`, which is NOT a release tag. D57 (r03):
# a build made exactly at its own release tag prints the bare version
# with a pin clause, and every other build prints `+dev.<commit>` and
# claims nothing; unverifiable is dev. This one is the second kind, and
# says so on both pages that print it:
#
#   wolf 0.2.8+dev.3103577 (wolfgang, pin 3103577)
#
# The stamp is still the dist builder's, never a build script's (D33):
# `cargo xtask dist` probes git and sets WOLF_COMMIT at compile time
# (and WOLF_RELEASE only when a tag points at HEAD, which is what makes
# this line honest), so a plain `cargo build` at this same rev answers
# `0.2.8+dev.unknown` and cannot even name the commit. book.yml's
# samples lane already computes the pair the same way — it sets
# WOLF_RELEASE only from `git tag --points-at HEAD` — so the lane
# reproduces this exact string with no edit.
