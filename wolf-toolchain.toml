[wolf]
# wolf-lang at the v0.2.3 release tag. D57 (r03): a build made exactly
# at its own release tag prints the bare version with a pin clause —
# `wolf 0.2.3 (wolfgang, pin 3befc3e)` — and every other build prints
# `+dev.<commit>` and claims nothing; unverifiable is dev. The stamp is
# the dist builder's, never a build script's (D33): `cargo xtask dist`
# probes git and sets WOLF_COMMIT/WOLF_RELEASE at compile time, so a
# plain `cargo build` at this same rev answers `0.2.3+dev.unknown`.
# The book's version transcripts print the bare release string, so the
# pinned wolf must be built with the dist builder or with its stamp
# reproduced (release profile, WOLF_COMMIT=3befc3e WOLF_RELEASE=v0.2.3
# — what book.yml's samples lane does; a debug build produces an
# unstamped binary and fails the two version transcripts).
#
# This bump (bs26) crosses s60b + s134 plus the r06 release wave — the
# archive returns. What it changes for the book, measured at this tag:
#   * WINDOWS GROWS THE TASK LAYER. `spawn` and scopes, `proc`,
#     channels and `select`, `sync`/`when`, `os.signal` and `net`
#     deadlines compile and run natively on windows x86-64. v0.2.2
#     refused twenty-one corpus rows by construct name; that table is
#     retired and the native lane measures at macOS parity there. This
#     is the release samples-os.toml's four ch30 rows were dated to,
#     and they retire at this bump — the mechanism proving itself by
#     FLIPPING on the windows lane before the rows come out (bs25's
#     rule: a row is removed in the pin-bump commit that makes it
#     false, never silently absorbed).
#   * WHAT WINDOWS STILL REFUSES, BY NAME, and the book still says so:
#     `wolf build --release` (the LLVM tier is s60c's) and EXTERNAL
#     `reload`/`upgrade` signal delivery, which has no Windows analog.
#     ch01 §1.2's `--release` refusal sentence stays whole.
#   * FOUR ARCHIVES AT THIS TAG. linux-aarch64's archive is back
#     (#213): v0.2.2's learner-path smoke gated the upload on a native
#     tier that host does not serve, so the arm archive was built and
#     thrown away. §1.2's install ledger row narrows on it.
#   * D71 — THE SPAN IS THE OFFENDING TOKEN (#220). E0201 and its
#     siblings (E0203, E0206, E0207, the missing `=`/initializer
#     reports) were a zero-width point at the offending token's start
#     and now span the token. wolf-lang's blast-radius measurement
#     predicted 7 widening renderings in this repo. MEASURED HERE AT
#     THE BUMP: zero. The book holds 8 E0201 renderings across 5
#     diagnostic snapshots and every one of them points at a
#     one-character token — `)` (ch04/s3), `y` (ch04/s8), `{`
#     (ch12/s11, ch12/ex12-9 ×4) — or at end of line (ch14/s3), and a
#     one-character span and a zero-width point render the same single
#     caret. Probed both ways to be sure the change is real and the
#     book simply does not exercise it: `(1 abc)` refuses `^` at
#     v0.2.2 and `^^^` at v0.2.3. Zero snapshots re-record.
#   * The anchors HOLD at 411: not one added, not one removed, not one
#     retargeted (both key sets diffed, per the is30 lesson). The
#     grammar gains #215's twelve missing productions — SCALAR, NL,
#     STR_TEXT, CHAR_TEXT, MULTILINE_STRING with MULTI_PART/MULTI_TEXT,
#     RAW_STRING with HASH_FENCE/RAW_TEXT, GENERALIZED_STRING with
#     GEN_TEXT — three literal forms a reader could previously derive
#     nothing at all for. Appendix A regenerates on them.
#   * The catalog does NOT move: 169 codes at v0.2.2 and 169 here,
#     identical line for line. D71 rewidened a span and added no code.
#     Appendix C's count stands.
#   * `wolf interface` embeds the toolchain version by design, so
#     ch22's interface transcript re-records (toolchain 0.2.2 -> 0.2.3,
#     both hashes with it), 22-9's solution with it, and ch25's publish
#     record carries the moved interface hash — which samples-os.toml's
#     windows ch25 transcript row carries too, and re-records here.
#   * 4 runner movers at this bump, all classified, residue empty: the
#     2 version transcripts (ch01 §1.2, the colophon), ch22's interface
#     stamp, and ch25's publish record. Two hand-held records move with
#     them, neither replayed by the runner and both re-measured rather
#     than reasoned about: 22-9's solution transcript (the same embedded
#     toolchain version) and ch04 §4.3's divergence paragraph, which the
#     lupin half of this bump heals. Samples hold at 459 passed / 5
#     pending / 0 failed with zero flips on macOS before the sprint's
#     own work.
#
# This rev IS the tag, so the transcripts stay clean (D57).
repo = "wolffe-lang/wolf-lang"
