# The pinned toolchain the book is true for (bs00 contract, target 2).
# Bumps are deliberate, in their own commit, CI-green — same policy as
# wolf-lang s00's rust-toolchain. The colophon repeats these values; the
# doc-truth CI job compares them.

[wolf]
# wolf-lang at M1 plus the concurrency runtime, the std unblock,
# `wolf test`, the warning system, the lived lint corpus, and
# deterministic checked-lane verdicts: `wolf build`/`wolf run` compile
# and execute real programs, and the runtime carries tasks, channels,
# select, `when`, and procs. The wave-four close put the `str` method
# set, `List` operations, value-position interpolation with format
# specs, and the nine `fs_*` builtins into native lowering, which is
# what makes Part 5's first three chapters buildable; wave five's first
# lane added the deterministic scheduler; the package manager (chapters
# 22, 23 and 24 are written on it), the idiom arbiter's eleven
# convention lints, argv and env, and the release tier arrived with the
# c09 wave. Native concurrency landed with c09 too: `scope`/`s.spawn`/
# `channel`/`select`/`freeze` lower and link. The traits-era pass
# crossed the dispatch campaigns (static trait dispatch, default
# bodies, `v as dyn Trait`, primitive impls, explicit application) and
# moved the stamped pairing line for the first time since 0.1.8.
#
# This bump (the declaration pass) crosses the post-M2 wave. M2 itself
# was declared at this sha's history (wolf-lang#89): the suite geomean
# against naive `clang -O3` is 1.080, the primary gate HOLDS on its
# third consecutive nightly (bench/ritual-ledger.jsonl, 2026-08-24T03:39Z,
# commit 2ff4dd1), with the two documented exceptions spent — b3_churn
# (checked adds on input-derived values, X3's renounced win) and
# word_count (boundary-computing iteration vs a boundary-free scan).
# Around the declaration: fmt2's suffix family (#74), s106's net
# crossing (the s39 arm falls; timeout and spawn-accept lower), and
# s105 — regions and closures are values, capture sets recorded,
# prov_holy_grail runs, and the mem tier follows region provenance
# through aggregates.
#
# What the bump changes for the book, measured at this sha:
#   * The catalog is unchanged (154 codes); the anchors grow one clause
#     family entry ([abi.native.closure]); the grammar is byte-identical.
#     Vendored spec artifacts re-vendored for the anchor line alone.
#   * The escape checker follows provenance through aggregates: a
#     container write from inside an open scratch region is E1010 even
#     when the write aims at an outer container. Chapter 8 §8.6's
#     two-windows sample is re-spelled at this bump (the value leaves by
#     assignment; the push happens after the brace), and lupin's is16
#     fault (below) is the same rule's dynamic half — the two machines
#     moved together.
#   * `wolf build --release` compiles and links shipped kernels — the
#     saxpy shape (`ys[i] = …` through a `mut` receiver) builds and runs
#     on both tiers, which is what opens ch21 §21.1–§21.2. `wolf bench`
#     still answers `not yet` (ch20 holds; §21.5 holds with it).
#     Contract attributes still parse and verify nothing (ch19 holds).
#
# This sha is the newest non-bot commit on trunk; the parent project's
# gauntlet and bench-gates runs are green on it, which is what the gate
# asks for.
repo = "wolffe-lang/wolf-lang"
rev = "fc7fdecbe30180296009c1666902ac816d7e9370"
impl_version = "0.1.0"

[lupin]
# wolf-interp at the is16 merge on trunk: the stamped version line names
# lupin 0.1.13, and the pairing asymmetry the last two bumps restated is
# over — the compiler's line names 0.1.13 at pin c9da6d9, and the
# interpreter's line names the same pin back. The book, the compiler and
# the interpreter describe one toolchain again, and the two version
# transcripts (colophon, §1.2) move accordingly.
#
# What the releases since 0.1.10 carry, as the book meets them:
# containers know their home (is16) — a read that reaches into a freed
# region is trap(region-fault) citing [mem.region.intra.2], which is
# E1010's dynamic meaning and closes the oldest divergence chapter 8's
# ledger recorded (the escape rule was static-only; it is not any more —
# exercise 8-3's program now traps at the read on both machines' terms).
# Default bodies dispatch through the implementing type, so chapter 5's
# default-body fence graduates from the compiler-only lane to the lupin
# lane. Primitive impls still do not resolve (`Text.text(n)` on an int
# answers `unsupported`), comptime stays the compiler's engine by
# design, and the machine still has no filesystem by design — the
# remaining `wolf-run` fences hold on those three reasons, re-verified
# at this rev.
#
# The rev is the trunk merge commit, not an annotated tag: the pinning
# target is the is16 close, and the stamped pairing line above is the
# release identity the transcripts print.
repo = "wolffe-lang/wolf-interp"
rev = "859a23b930968a566d957e6b9cf136889227a7cd"
version = "lupin 0.1.13 (wolf-interp, reference interpreter at pin c9da6d9)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
repo = "wolffe-lang/wolf-lsp"
rev = "dc05c271b683d1c8b544ab5fae74e66a4a034af7"

[wolf-repl]
# REPL transcript replay is pending(is08): wolf-repl blocks are counted
