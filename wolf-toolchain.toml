# The pinned toolchain the book is true for (bs00 contract, target 2).
# Bumps are deliberate, in their own commit, CI-green — same policy as
# wolf-lang s00's rust-toolchain. The colophon repeats these values; the
# doc-truth CI job compares them.

[wolf]
# wolf-lang at M1 plus the concurrency runtime, the std unblock, and
# `wolf test`: `wolf build`/`wolf run` compile and execute real
# programs, the runtime carries tasks, channels, select and `when`, and
# the driver reports warnings. Trunk moved twice while bs06 was
# drafting; the whole suite was re-verified at each sha and did not
# move, which is recorded in bs06's closeout.
# `wolf conform-run` remains the sample runner's checker rung, because
# it reports a machine-readable verdict for every phase — and for the
# concurrency surface that verdict is `unsupported` at `resolve`, so
# Part 3 takes its static verdicts from the rungs the compiler does
# reach (the `when`-arity rejection is one) and its runs from lupin.
repo = "tenseleyFlow/wolf-lang"
rev = "dae8ea034f06f8ce7be88fc1bf41149713548614"
impl_version = "0.0.1"

[lupin]
# wolf-interp: runs programs, reports traps, evaluates REPL snippets,
# and is the implementation that executes Part 3 — the scheduler, the
# seeded decision stream, and the schedule explorer are all its.
repo = "tenseleyFlow/wolf-interp"
rev = "5f1e58d0a297957004f642efe954c694a8561fd1"
version = "lupin 0.1.4 (wolf-interp, pin ad6cef7)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
repo = "tenseleyFlow/wolf-lsp"
rev = "dc05c271b683d1c8b544ab5fae74e66a4a034af7"

[wolf-repl]
# REPL transcript replay is pending(is08): wolf-repl blocks are counted
# and reported, never silently unchecked. Flip this to a rev when is08
# ships.
pending = "is08"
