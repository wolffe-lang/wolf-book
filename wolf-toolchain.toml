# The pinned toolchain the book is true for (bs00 contract, target 2).
# Bumps are deliberate, in their own commit, CI-green — same policy as
# wolf-lang s00's rust-toolchain. The colophon repeats these values; the
# doc-truth CI job compares them.

[wolf]
# wolf-lang at M1 plus the concurrency runtime, the std unblock,
# `wolf test`, the warning system, the lived lint corpus, and
# deterministic checked-lane verdicts: `wolf build`/`wolf run` compile
# and execute real programs, and the runtime carries tasks, channels,
# select, `when`, and procs. The wave-four close put the `str` method
# set, `List` operations, value-position interpolation with format
# specs, and the nine `fs_*` builtins into native lowering, which is
# what makes Part 5's first three chapters buildable, and wave five's
# first lane added the deterministic scheduler.
# This bump crosses seven waves at once, and three of them move the
# book. The **package manager**: `wolf.pkg` as declarative data,
# `wolf add/rm/update/audit/tree/why`, the `wolf.sum` ledger, the I13
# capability tree, and codes E1501-E1506 — chapters 22, 23 and 24 are
# written on them. The **idiom arbiter**: eleven convention lints,
# which is where the printed `wolf build` transcript in chapter 27
# grew two warning stanzas (book/ch27.md's ledger carries the row —
# 38 corpus files draw W0603 and the disagreement is about the book's
# row style, not about that program). The **release tier**
# (`wolf build --release` through LLVM), which the book does not print
# anywhere yet. Also: `wolf 0.1.0 (wolfgang)` with the pairing line,
# argv and env, the match tier's string-pattern fix, the comptime fold
# published to both lanes, and the D39/D40 mode teeth.
#
# It is NOT the newest green trunk sha, and the reason is recorded
# because it is a gate holding. Trunk's later shas land native
# concurrency, and at every one of them the compiler ICEs on shipped
# book samples: `wolf conform-run` on book/ch12/s7 and ch12's exercise
# 12-3 fails WIR verification (`[dominance]`, a select lowering whose
# `iconst` is used outside its dominator), exercise 12-6 fails the
# canonical-dump reparse, and the sample runner has no verdict JSON to
# read — a hard error, not a drift. Two more (`ch03/s15`, `ch07/s12`)
# fail `[type]` verification at every sha in this range; they do not
# fail the suite only because their directive is a `run(…)` the runner
# checks under lupin. This sha is the newest one whose `ci` run is
# green AND on which the whole book suite is green, which is what the
# gate asks for. The ICEs are filed; the pin moves when they close.
repo = "wolffe-lang/wolf-lang"
rev = "c650e73dbe584c70c464038365bc33efafc85844"
impl_version = "0.1.0"

[lupin]
# wolf-interp at the v0.1.8 tag: runs programs, reports traps,
# evaluates REPL snippets, and is the implementation that executes
# Part 3 — the scheduler, the seeded decision stream, and the schedule
# explorer are all its. 0.1.6 brought the E11xx parity rejections that
# chapter 13 is written on; 0.1.7 pushed literals' int adoption, one
# admission ladder for `explore` and `run`, and ten idiom lints; 0.1.8
# lands the D39 write barrier (a write through a read-mode binding
# traps exclusivity) and the D40 loop-extent claim (mutation during
# iteration traps at the mutation). It is also the release pairing: the
# interpreter names the compiler sha it was differentially tested
# against, and the compiler names it back.
# The rev is the annotated tag object (commit `7886559`), matching the
# convention this file has used since 0.1.5. The tag's own CI run is
# green, as are the two commits above it.
repo = "wolffe-lang/wolf-interp"
rev = "c0a563a5cf594bcf95cf78452cef8a66d4758d1c"
version = "lupin 0.1.8 (wolf-interp, reference interpreter at pin 26fa98e)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
repo = "wolffe-lang/wolf-lsp"
rev = "dc05c271b683d1c8b544ab5fae74e66a4a034af7"

[wolf-repl]
# REPL transcript replay is pending(is08): wolf-repl blocks are counted
# and reported, never silently unchecked. Flip this to a rev when is08
# ships.
pending = "is08"
