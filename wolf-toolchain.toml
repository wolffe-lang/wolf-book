#
#   wolf 0.2.8+dev.2c03ed9 (wolfgang, pin 2c03ed9)
#   paired with lupin 0.1.28 (reference interpreter), pin 5c729e8
#   lupin 0.1.30 (wolf-interp, reference interpreter at pin 2c03ed9)
#
# AT bs35 THE LUPIN PIN DOES NOT MOVE, and the pairing paragraph below
# is rewritten because the OTHER half did. The stamped lines this
# printing is graded on are:
#
#   wolf 0.2.9 (wolfgang, pin 4c60946)
#   paired with lupin 0.1.29 (reference interpreter), pin e9a17cb
#   lupin 0.1.30 (wolf-interp, reference interpreter at pin 2c03ed9)
#
# NEITHER HALF IS EXACT. Both computed from the two stamps, never
# hand-written (ww16):
#
#   THE COMPILER'S HALF IS ONE RELEASE. It names lupin 0.1.29 and the
#     interpreter beside it is 0.1.30, because the interpreter
#     published once after this compiler was cut. This half read TWO at
#     the last bump and closes by one.
#   THE INTERPRETER'S HALF IS FOURTEEN COMMITS. It names 2c03ed9, which
#     is not the revision this file now pins: `git rev-list --count
#     2c03ed9..4c60946` is 14 on the same line of history, ancestry
#     checked rather than assumed. This half read ZERO at the last bump
#     and opens.
#
# STILL NO SUPERLATIVE, and the temptation here is a real one: it is
# easy to write that this is the first printing where neither name is
# exact. Nothing in this file's history supports that and nothing was
# measured to support it, so §1.2 and the colophon say what each half
# reads and stop. This file's own history is where a claimed first was
# caught (the bs32 contract's "a gap of zero for the first time", which
# the log disproved), and the halves have swapped direction on three
# consecutive bumps before this one — this bump does not swap them, it
# moves both.
