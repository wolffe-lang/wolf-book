[lupin]
# wolf-interp at the v0.1.29 release tag (is41): the stamped line names
# lupin 0.1.29 at pin e9a17cb. A lupin release's pin is the wolf-lang
# revision it was built and differentially tested against, and is41
# released against `e9a17cb` — which is the revision THIS FILE PINNED
# LAST PRINTING, and is ten commits behind the one it pins now.
#
#   wolf 0.2.8+dev.2c03ed9 (wolfgang, pin 2c03ed9)
#   paired with lupin 0.1.28 (reference interpreter), pin 5c729e8
#   lupin 0.1.29 (wolf-interp, reference interpreter at pin e9a17cb)
#
# THE PAIR DISAGREES IN BOTH DIRECTIONS THIS PRINTING, and the two
# halves are in different units. Both computed from the two stamps,
# never hand-written (ww16):
#
#   THE COMPILER'S HALF IS ONE RELEASE. It names lupin 0.1.28; 0.1.29
#     is the interpreter beside it. Ordinary: the interpreter published
#     after this compiler was built. This half read ZERO at bs33 and
#     opens again here.
#   THE INTERPRETER'S HALF IS TEN COMMITS, and is not a release count.
#     It names `e9a17cb`; `git rev-list --count e9a17cb..2c03ed9` is 10.
#     There is no release to count to, because the compiler pinned here
#     has not been released, so the honest reading is a commit distance
#     and it is written as one — the same shape bs33 recorded at 28.
#
# THE SENTENCE THAT IS NOT WRITTEN, and why. Taking 0.1.29 while leaving
# [wolf] at e9a17cb would have put BOTH stamps on one revision, and §1.2
# and the colophon could have said the pair sits at a single commit.
# That was measured and declined: it would have been true for about an
# hour, it costs a second bump's worth of replays and ledger churn, and
# this file's own history is where a claimed first was caught before
# (the bs32 contract's "a gap of zero for the first time", which the log
# disproved). r13 re-stamps PAIRING at v0.2.9 against 0.1.29; the
# sentence gets its turn there if it is still true then. §1.2 and the
# colophon print one release and ten commits, and claim no firsts.
#
# WHAT THE BOOK MEASURED AT THIS PIN, prediction first (bs34):
#   * PREDICTED EXACTLY 1 FLIP, named before the runner ran, and the
#     reasoning written down: the live direction at a lupin bump is the
#     `wolf-run(…)` directives, which retire when the INTERPRETER starts
#     serving them. There were 11 in the tree at 401f4db — 3 book fences
#     and 8 corpus files — and only ch01 §1.5's waits on anything is41
#     ships. The other ten want `comptime fn` (ch18's four), the env/fs
#     surface (ch22's one, ch30's four) and the descriptor crossing
#     (ch33's one), none of which is41 touches. The 94 `lupin-run(…)`
#     directives retire on COMPILER motion, so they were live this bump
#     for the first time in a while — see the wolf half above.
