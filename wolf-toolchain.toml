# The pinned toolchain the book is true for (bs00 contract, target 2).
# Bumps are deliberate, in their own commit, CI-green — same policy as
# wolf-lang s00's rust-toolchain. The colophon repeats these values; the
# doc-truth CI job compares them.

[wolf]
# wolf-lang at M1 plus the concurrency runtime, the std unblock,
# `wolf test`, the warning system, the lived lint corpus, and
# deterministic checked-lane verdicts: `wolf build`/`wolf run` compile
# and execute real programs, and the runtime carries tasks, channels,
# select, `when`, and procs. The wave-four close put the `str` method
# set, `List` operations, value-position interpolation with format
# specs, and the nine `fs_*` builtins into native lowering, which is
# what makes Part 5's first three chapters buildable; wave five's first
# lane added the deterministic scheduler; the package manager (chapters
# 22, 23 and 24 are written on it), the idiom arbiter's eleven
# convention lints, argv and env, and the release tier arrived with the
# c09 wave. Native concurrency landed with c09 too: `scope`/`s.spawn`/
# `channel`/`select`/`freeze` lower and link. The traits-era pass
# crossed the dispatch campaigns (static trait dispatch, default
# bodies, `v as dyn Trait`, primitive impls, explicit application) and
# moved the stamped pairing line for the first time since 0.1.8.
#
# This bump (bs17) crosses the s122–s127 wave plus the CI sweep. The
# headline for the book is s125: a compiled trap now names its site —
# the first stderr line stays the byte-identical `wolf-trap: <kind>`
# ABI, and a second line says `  at <file>:<line>:<col>`
# ([conf.trap.report]). D60 rides with it: a trap's exit status is
# per-machine and documented (native 134, reference interpreter 3;
# [conf.trap.exit]) and the KIND is the only comparison surface. The
# other half of the wave is the machine's: s59/s127 bring the native
# and release tiers to macOS/aarch64, so the compile-lane samples run
# on this book's development host as well as on the linux CI runner.
# s126/D61 adds the index-origin marker (`#![index(1)]`).
#
# What the bump changes for the book, measured at this sha:
#   * The catalog grows 164 -> 168: E0211, E0415, E0813, W0317. The
#     anchors grow 393 -> 397: [conf.trap.render], [conf.trap.report],
#     [conf.directive.standalone], [gram.attr.index],
#     [gram.expr.index.origin] arrive; [gram.lex.ident] DROPS OUT of
#     the regenerated set — a spec-extract scanner defect at this rev
#     (s126's bare `[` literals derail its bracket scanner, filed
#     wolf-lang#170); the clause text stands, the book cites the tag
#     nowhere, and the anchor rides the fix. The grammar gains
#     inner_attribute; Appendix A regenerates.
#   * `wolf --version`'s pairing line names lupin 0.1.15 at pin
#     a900b8c — the interpreter release the s122–s125 differential ran
#     against — while the lupin beside it is the 0.1.16 release naming
#     pin e561c6f back. The two lines name different releases on
#     purpose, one release apart (the is27 release rode AFTER the last
#     differential stamp); the colophon and §1.2 print them as they
#     are, the way the 0.1.8/0.1.10 era did.
#   * 34 console rows re-record at this bump, all classified, residue
#     empty: 31 are lupin file-door diagnostic lines re-spelled
#     line:col by is27 (with the corpus EXERCISES.md hand-lane rows
#     that feed the Solutions page), 2 are the version transcripts
#     above, and 1 is §21.4's native trap gaining its site line. In
#     the other direction the host's own ledger empties: the 34
#     compile-lane rows that were environmental failures on
#     macOS/aarch64 at the old pin (native codegen was linux-only)
#     now build, run, and byte-compare on this machine — linux CI
#     keeps the gate either way.
#
# This sha is the newest non-bot commit on trunk; all six wolf-lang CI
# jobs are green on it, which is what the gate asks for.
repo = "wolffe-lang/wolf-lang"
rev = "addcd7f0bd90b16bfa8bec429ab7f27c46a2c1bb"
impl_version = "0.1.0"

[lupin]
# wolf-interp at the v0.1.16 release tag (is27, released at pin
# e561c6f): the stamped line names lupin 0.1.16 at pin e561c6f. The
# compiler's pairing line at this book's [wolf] rev names lupin 0.1.15
# at pin a900b8c — one release behind, because the is27 release
# followed the last differential stamp; each line is that tool's own
# documented fact, the two version transcripts (colophon, §1.2) print
# them as they are, and the KIND-level agreement the pairing exists
# for is unaffected. The book's [wolf] rev sits past e561c6f on the
# same trunk (s127, s126, the CI sweep); a release's pin is its
# identity, not this book's sample pin.
#
# What 0.1.16 carries, as the book meets it — is27, the lupin half of
# s125's trap-site pair: every file-door human fault line (trap, UB
# finding, static diagnostic, secondary spans included) spells its
# location `line:col` — 1-based line, 1-based column counted in
# characters — where 0.1.14 printed entry-relative byte offsets. That
# re-records 31 chapter console lines and the corpus's hand-checked
# solutions rows in this repo, and it closes the book's oldest
# diagnostic complaint (a learner counting bytes; wolf-lang#158). The
# REPL door deliberately keeps byte offsets (a session has no stable
# line numbering; documented in wolf-interp docs/repl.md), so the
# book's ~6 REPL-transcript span lines stay byte-span. Beneath it,
# 0.1.15 (is26) taught this machine `char` from the spec: `'…'`
# literals lex (E0110 refuses the malformed shapes by name), casts
# trap per D58, `chars()` yields `List[char]` — so chapter 2's §2.4
# no longer needs its compiler-lane scoping note, and both machines
# read every char sample in this book. D57 discipline: this rev IS
# the tag, so the transcripts stay clean.
repo = "wolffe-lang/wolf-interp"
rev = "2777fa3a57aa6bcf4505b9e33e4b47d97936d19a"
version = "lupin 0.1.16 (wolf-interp, reference interpreter at pin e561c6f)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
# Bumped with the bs13 pin move: the grammar at this rev carries the
# full operator set and the numeric-type keywords (the old pin knew
# `Self|bool|int|str` and a fraction of the operators). It does NOT yet
# know `char` or the `'…'` literal — s121 postdates it — so char code
# highlights as plain text until wolf-lsp regenerates its grammar; a
# rendering gap, not a truth gap, and it rides the next wolf-lsp bump.
repo = "wolffe-lang/wolf-lsp"
rev = "2b89cfbd0071aa9aa26d18b0483334743faeb29e"

[wolf-repl]
# REPL transcript replay is pending(is08): wolf-repl blocks are counted
# and reported, never silently unchecked. Flip this to a rev when is08
# ships.
pending = "is08"
