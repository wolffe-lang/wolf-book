# The pinned toolchain the book is true for (bs00 contract, target 2).
# Bumps are deliberate, in their own commit, CI-green — same policy as
# wolf-lang s00's rust-toolchain. The colophon repeats these values; the
# doc-truth CI job compares them.

[wolf]
# wolf-lang at the v0.2.1 release tag. D57 (r03): a build made exactly
# at its own release tag prints the bare version with a pin clause —
# `wolf 0.2.1 (wolfgang, pin 75fd2d0)` — and every other build prints
# `+dev.<commit>` and claims nothing; unverifiable is dev. The stamp is
# the dist builder's, never a build script's (D33): `cargo xtask dist`
# probes git and sets WOLF_COMMIT/WOLF_RELEASE at compile time, so a
# plain `cargo build` at this same rev answers `0.2.1+dev.unknown`.
# The book's version transcripts print the bare release string, so the
# pinned wolf must be built with the dist builder or with its stamp
# reproduced (release profile, WOLF_COMMIT=75fd2d0 WOLF_RELEASE=v0.2.1
# — what book.yml's samples lane does; the debug-build recipe of the
# a900b8c/addcd7f eras produces an unstamped binary and fails the two
# transcripts). At THIS tag `cargo xtask dist` completes on every
# tier-1 target, windows included — the staticlib-naming defect that
# made v0.2.0's own dist a three-of-four is fixed in the release.
#
# This bump (bs22) crosses s129 + s130 plus the r04 release wave. The
# headline for the book is patterns: struct patterns go through the
# whole pipe ([gram.pat.struct]) in every binder position and then in
# match arms, arms take the full product domain (tuple and struct
# patterns, @-bindings, literals at product depth, products nested
# through enum payloads), and a callee's slice of a lent byte view
# resolves per [mem.list.slice] instead of meeting a misattributed
# refusal. r04 is the release's own honesty: four places where the
# written language and the built one had drifted, each measured on
# the tools first.
#
# What the bump changes for the book, measured at this tag:
#   * The catalog grows 168 -> 169: E0814 arrives ("struct pattern
#     fields do not match the struct" — the lean E0408 takes at
#     construction, taken at destructuring). Appendix C's count
#     re-records; no code left.
#   * The anchors grow 403 -> 404: [gram.pat.struct] registers. The
#     grammar gains the struct-pattern production and its `field_pat`,
#     and `UNI_ESC` splits out of `CHAR_ESC` bounded at one to six hex
#     digits (the prose was the letter, the production said
#     `HEX_DIGIT+`); Appendix A regenerates on both.
#   * `wolf --version` answers the bare release string with its pin
#     clause, and for the first time since the 0.1.15/0.1.16 era the
#     two tools name the SAME interpreter release: the compiler pairs
#     with lupin 0.1.20 at pin b80d239 and the lupin beside it is
#     0.1.20 naming b80d239 back. The colophon's asymmetry paragraph
#     retires with the fact that produced it.
#   * `wolf interface` embeds the toolchain version by design, so
#     ch22's interface transcript re-records (toolchain 0.2.0 ->
#     0.2.1, both hashes move with it), and ch25's publish record
#     carries the same moved interface hash.
#   * W1001 stopped lying (#192): it claimed a region "never
#     allocates" on blocks whose callees allocate through it, and now
#     requires no call in the region's extent either. ch09's s11
#     snapshot loses the warning and keeps its E1401.
#   * 5 runner movers at this bump, all classified, residue empty: the
#     2 version transcripts above, ch22's interface stamp, ch25's
#     publish record, and ch09/s11's snapshot. Samples hold 448
#     passed / 5 pending / 0 failed with zero pending flips.
#
# This rev IS the tag, so the transcripts stay clean (D57).
repo = "wolffe-lang/wolf-lang"
rev = "75fd2d0b25b6ed995ec7293053bc32fb3497e272"
impl_version = "0.2.1"

[lupin]
# wolf-interp at the v0.1.20 release tag (is31): the stamped line names
# lupin 0.1.20 at pin b80d239. A lupin release's pin is the wolf-lang
# revision it was built and differentially tested against; no v0.2.1
# tag existed at the is31 release step, so the pin is wolf-lang's s130
# merge sha, whose spec tree is byte-identical to the tag's (404
# anchors, nothing gained, nothing dropped). The compiler's pairing
# line names lupin 0.1.20 at the same b80d239, so both lines agree for
# the first time since the 0.1.15/0.1.16 era, and the asymmetry the
# colophon printed as it was is simply not there to print.
#
# What 0.1.19 + 0.1.20 carry, as the book meets them:
#   * Struct patterns in every binder position (is30) and then in
#     match arms (is31), field-set rules the same in both: an unknown
#     field declines by E0403's name, a missing-without-`..`,
#     duplicate or empty one by E0814's. The seven struct-bearing
#     witnesses of the #179 table move from `unsupported` to running;
#     six join the agreement class and the seventh is honest
#     conservatism (exhaustiveness is the type checker's).
#   * Destructures move element-wise (is30): `let (x, _) = p` moves
#     `p.0` only, and the untouched elements stay readable.
#   * An arm takes the WHOLE scrutinee when it binds a non-`Copy`
#     piece. The field-wise partial-move story is a binder rule on
#     both machines; neither invents finer-grained arm semantics.
#   * The lent-view byte slice joins the agreement class (#184), and
#     the net byte tier resolves (wolf-interp#52).
#   * Zero book samples, console rows, or corpus rows move on the
#     lupin half of this bump — measured, both lanes. Every one of the
#     455 files carried from 0.1.19 is verdict-identical.
# D57 discipline: this rev IS the tag, so the transcript stays clean.
repo = "wolffe-lang/wolf-interp"
rev = "e3736c154dad2d5c4bdb7b7ad706b74b56a903f0"
version = "lupin 0.1.20 (wolf-interp, reference interpreter at pin b80d239)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
# Bumped with the bs13 pin move: the grammar at this rev carries the
# full operator set and the numeric-type keywords (the old pin knew
# `Self|bool|int|str` and a fraction of the operators). It does NOT yet
# know `char` or the `'…'` literal — s121 postdates it — so char code
# highlights as plain text until wolf-lsp regenerates its grammar; a
# rendering gap, not a truth gap, and it rides the next wolf-lsp bump.
repo = "wolffe-lang/wolf-lsp"
rev = "2b89cfbd0071aa9aa26d18b0483334743faeb29e"

[wolf-repl]
# REPL transcript replay is pending(is08): wolf-repl blocks are counted
# and reported, never silently unchecked. Flip this to a rev when is08
