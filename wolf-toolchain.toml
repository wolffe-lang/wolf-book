# The pinned toolchain the book is true for (bs00 contract, target 2).
# Bumps are deliberate, in their own commit, CI-green — same policy as
# wolf-lang s00's rust-toolchain. The colophon repeats these values; the
# doc-truth CI job compares them.

[wolf]
# wolf-lang at M1 plus the concurrency runtime, the std unblock,
# `wolf test`, the warning system, the lived lint corpus, and
# deterministic checked-lane verdicts: `wolf build`/`wolf run` compile
# and execute real programs, and the runtime carries tasks, channels,
# select, `when`, and procs. The wave-four close put the `str` method
# set, `List` operations, value-position interpolation with format
# specs, and the nine `fs_*` builtins into native lowering, which is
# what makes Part 5's first three chapters buildable; wave five's first
# lane added the deterministic scheduler; the package manager (chapters
# 22, 23 and 24 are written on it), the idiom arbiter's eleven
# convention lints, argv and env, and the release tier arrived with the
# c09 wave. Native concurrency landed with c09 too: `scope`/`s.spawn`/
# `channel`/`select`/`freeze` lower and link. The traits-era pass
# crossed the dispatch campaigns (static trait dispatch, default
# bodies, `v as dyn Trait`, primitive impls, explicit application) and
# moved the stamped pairing line for the first time since 0.1.8.
#
# This bump (bs13) crosses the s116–s121 wave, 17 days after the last
# one, and it is the first bump the ledger gate supervises: bs12 triaged
# all 169 audit rows at the previous pin, so every surviving row is
# re-measured against this one. The wave's headline for the book is
# s121/D58: `char` is a Unicode scalar value — not a byte, not a
# grapheme, not an integer — with `'…'` literals (E0110 refuses the
# malformed shapes at the lexer), total `char as int`, a trapping
# `int as char`, and `chars() -> List[char]`. Chapter 2 teaches it at
# this bump, and the byte-scan workaround prose it obsoletes retires.
#
# What the bump changes for the book, measured at this sha:
#   * The catalog grows 154 -> 164: E0110 (malformed char literal),
#     E0414 (main's signature), E0609 (nested error rows), and the
#     E1601–E1607 constant-time family. The anchors grow 344 -> 393
#     ([type.char.*], [gram.lex.char], [mem.str.chars], the ct.* and
#     os.random/os.signal families, among others). The grammar gains
#     CHAR_LIT; Appendix A regenerates.
#   * `wolf --version`'s pairing line names lupin 0.1.14 at pin 90c90df,
#     and lupin 0.1.14 names the same pin back — the pairing the two
#     transcripts print is symmetric again (both transcripts move).
#   * 43 samples flipped at this bump, all classified, residue empty:
#     41 are lupin 0.1.14's receiver-mode enforcement (X1's call-site
#     mode, dynamic since is17-era work — bare `xs.push(…)` is now
#     `trap(exclusivity)` under lupin exactly where wolf has said E0804
#     all along; the book re-spells every Part-1 receiver `(mut xs)`),
#     and 2 are the version transcripts above. One of the 41 wore a
#     disguise: ch16's ex16-1 trapped inside a spawned task, the send
#     never happened, and the `else` on `recv()` swallowed the fault
#     into a bare exit 1.
#
# This sha is the newest non-bot commit on trunk; the parent project's
# gauntlet and bench-gates runs are green on it, which is what the gate
# asks for.
repo = "wolffe-lang/wolf-lang"
rev = "a900b8c8540246ff69aaee424ba412d06bc6b340"
impl_version = "0.1.0"

[lupin]
# wolf-interp at the v0.1.14 release tag (the is14–is25 catch-up,
# released at pin 90c90df): the stamped line names lupin 0.1.14 at pin
# 90c90df, the compiler's pairing line at this book's [wolf] rev names
# the same release and pin back, and the two version transcripts
# (colophon, §1.2) move accordingly. The book's [wolf] rev sits four
# merges past 90c90df on the same trunk; the stamped pairing pin is the
# release identity, not this book's sample pin, and the transcripts
# print it as the tools do.
#
# What 0.1.14 carries, as the book meets it: receiver-mode enforcement —
# X1's call-site mode is now dynamic, so bare `xs.push(…)` is
# trap(exclusivity) naming E0804's spelling, which closes ch21's oldest
# divergence row (lupin ran what wolf refused) and re-spells 41 samples
# in this repo. Deterministic scheduling, the REPL line editor (is25),
# and the D57 version-suffix discipline (an off-tag build says
# +dev.<commit>; this rev IS the tag, so the transcripts stay clean).
# NOT yet in this machine: `char` — a `'…'` literal is E0101 ("`'`
# begins no token") and `chars()` answers `unsupported` by name, so
# chapter 2's char sections run on the compiler lane with an honest
# per-machine note until the wolf-interp char sprint (is26) lands.
repo = "wolffe-lang/wolf-interp"
rev = "a3591de454ef5262872f86640e7b1457431d46d6"
version = "lupin 0.1.14 (wolf-interp, reference interpreter at pin 90c90df)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
# Bumped with the bs13 pin move: the grammar at this rev carries the
# full operator set and the numeric-type keywords (the old pin knew
# `Self|bool|int|str` and a fraction of the operators). It does NOT yet
# know `char` or the `'…'` literal — s121 postdates it — so char code
# highlights as plain text until wolf-lsp regenerates its grammar; a
# rendering gap, not a truth gap, and it rides the next wolf-lsp bump.
repo = "wolffe-lang/wolf-lsp"
rev = "2b89cfbd0071aa9aa26d18b0483334743faeb29e"

[wolf-repl]
# REPL transcript replay is pending(is08): wolf-repl blocks are counted
# and reported, never silently unchecked. Flip this to a rev when is08
# ships.
pending = "is08"
