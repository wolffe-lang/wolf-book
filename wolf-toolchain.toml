# The pinned toolchain the book is true for (bs00 contract, target 2).
# Bumps are deliberate, in their own commit, CI-green — same policy as
# wolf-lang s00's rust-toolchain. The colophon repeats these values; the
# doc-truth CI job compares them.

[wolf]
# wolf-lang at the v0.2.0 release tag — the first pin this book can
# verify from the binary itself. D57 (r03): a build made exactly at its
# own release tag prints the bare version with a pin clause —
# `wolf 0.2.0 (wolfgang, pin c88ab64)` — and every other build prints
# `+dev.<commit>` and claims nothing; unverifiable is dev. The stamp is
# the dist builder's, never a build script's (D33): `cargo xtask dist`
# probes git and sets WOLF_COMMIT/WOLF_RELEASE at compile time, so a
# plain `cargo build` at this same rev answers `0.2.0+dev.unknown`.
# The book's version transcripts print the bare release string, so the
# pinned wolf must be built with the dist builder or with its stamp
# reproduced (release profile, WOLF_COMMIT=c88ab64 WOLF_RELEASE=v0.2.0
# — what book.yml's samples lane does since this bump; the debug-build
# recipe of the a900b8c/addcd7f eras produces an unstamped binary and
# fails the two transcripts).
#
# This bump (bs19) crosses s128 plus the r03 release wave. s128 is the
# headline for the book: D62 makes `str + str` and `str += str`
# interpolation-append on every lane (a mix like `"a" + 1` keeps its
# E0409 refusal by name), D63 admits comma-grouped binders, tuple
# destructuring moves element-wise, and a list slice is a fresh-List
# copy that `for` can walk. r03 is the release's own honesty: the D57
# version stamp above, the spec-extract bracket scanner fixed, and the
# pairing moved to lupin 0.1.17.
#
# What the bump changes for the book, measured at this tag:
#   * The catalog HOLDS at 168 codes — E0409's domain narrowed (two
#     strs now pass), no code arrived or left; Appendix C stands.
#   * The anchors grow 397 -> 403: [gram.lex.ident] RETURNS (F-0100,
#     wolf-lang#170/#177 — the bs17 note said the anchor rides the
#     fix, and this is the fix), and s128 registers [mem.list.slice],
#     [type.str], [type.str.concat], [type.str.concat.cost],
#     [type.str.concat.mix]. The grammar's let/var admit binder
#     groups; Appendix A regenerates.
#   * `wolf --version` answers the bare release string with its pin
#     clause, and its pairing line names lupin 0.1.17 at pin addcd7f —
#     the release the r03 differential ran against — while the lupin
#     beside it is 0.1.18 naming the same spec pin back. One release
#     apart, on purpose: the 0.1.15/0.1.16-era asymmetry precedent;
#     the colophon and §1.2 print both as they are.
#   * `wolf interface` embeds the toolchain version by design, so
#     ch22's interface transcript re-records (toolchain 0.1.0 ->
#     0.2.0, both hashes move with it).
#   * 4 console rows re-record at this bump, all classified, residue
#     empty: the 2 version transcripts above, ch22's interface stamp,
#     and ch22's E0302 line (the lupin half — see [lupin]). Samples
#     hold 401 passed / 5 pending / 0 failed with zero pending flips,
#     and the hand-checked corpus lane replayed clean everywhere else.
#
# This rev IS the tag, so the transcripts stay clean (D57).
repo = "wolffe-lang/wolf-lang"
rev = "c88ab6441b2706e20375deeec86eaf6da9bde25b"
impl_version = "0.2.0"

[lupin]
# wolf-interp at the v0.1.18 release tag (is29): the stamped line names
# lupin 0.1.18 at pin addcd7f. A lupin release's pin is the wolf-lang
# revision it was built and differentially tested against — wolf-lang's
# v0.2.0 tag postdates the is29 release, so both this release and the
# 0.1.17 the compiler pairs with name the addcd7f trunk rev (the is30
# release owns the re-pin question). The compiler's pairing line names
# lupin 0.1.17 (is28, same pin) — one release apart, each line that
# tool's own documented fact, exactly the asymmetry the 0.1.15/0.1.16
# era taught the colophon to print as it is.
#
# What 0.1.17 + 0.1.18 carry, as the book meets them:
#   * is28's D59 module story: E0302's teach-note grew a hint — "two
#     separate programs sharing a directory each mark themselves
#     `//! member: false` (D59)" — which re-records ch22's console
#     block, its corpus master row, and the Solutions page. This is
#     the bump's ONE lupin human-line drift, measured across the
#     runner's 190 replayed console blocks and every hand-checked
#     corpus row.
#   * D59's membership defaulting also reads a lone entry file
#     honestly now: a directory of standalone programs no longer
#     cross-trips [mod.dup] when one of them is run by name (observed
#     against the corpus exercise directories; at 0.1.16 the same
#     invocation refused E0302 on the sibling mains).
#   * is29 makes the first `match` arm yield (the wolf-interp #47/#48
#     take-reuse pair). Zero book samples, console rows, or corpus
#     rows move on it — measured, both lanes.
# D57 discipline: this rev IS the tag, so the transcript stays clean.
repo = "wolffe-lang/wolf-interp"
rev = "66dc06c500df20b23320843bd1c3f065899a230c"
version = "lupin 0.1.18 (wolf-interp, reference interpreter at pin addcd7f)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
# Bumped with the bs13 pin move: the grammar at this rev carries the
# full operator set and the numeric-type keywords (the old pin knew
# `Self|bool|int|str` and a fraction of the operators). It does NOT yet
# know `char` or the `'…'` literal — s121 postdates it — so char code
# highlights as plain text until wolf-lsp regenerates its grammar; a
# rendering gap, not a truth gap, and it rides the next wolf-lsp bump.
repo = "wolffe-lang/wolf-lsp"
rev = "2b89cfbd0071aa9aa26d18b0483334743faeb29e"

[wolf-repl]
# REPL transcript replay is pending(is08): wolf-repl blocks are counted
# and reported, never silently unchecked. Flip this to a rev when is08
# ships.
pending = "is08"
