[lupin]
# wolf-interp at the v0.1.28 release tag (is39 and is40): the stamped
# line names lupin 0.1.28 at pin 5c729e8. A lupin release's pin is the
# wolf-lang revision it was built and differentially tested against, and
# is40 released against the v0.2.8 TAG — THE SAME REVISION this file
# pins for wolf.
#
# THE PAIR READS 0 AND 27 COMMITS, AND THE SECOND NUMBER IS NOT A
# RELEASE COUNT. Both numbers computed from the two stamps, never
# hand-written (ww16), and re-computed at this bump because [wolf]
# moved off a tag:
#
#   wolf 0.2.8+dev.3103577 (wolfgang, pin 3103577)
#   paired with lupin 0.1.28 (reference interpreter), pin 5c729e8
#   lupin 0.1.28 (wolf-interp, reference interpreter at pin 5c729e8)
#
#   THE COMPILER'S HALF IS ZERO. It names lupin 0.1.28, which is the
#     interpreter beside it, release for release. This half read ONE
#     at bs32, and closed here for the ordinary reason: this compiler
#     was built after that interpreter published.
#   THE INTERPRETER'S HALF IS NOT A RELEASE NUMBER ANY MORE. It names
#     `5c729e8`, which is v0.2.8 — the last release the compiler above
#     it carries, and 27 commits behind the revision this file pins.
#     `git rev-list --count 5c729e8..3103577` is where that 27 comes
#     from. There is no release to count to, because the compiler
#     pinned here has not been released; the honest reading is a
#     commit distance and it is written as one.
#
# So the 0-or-1 release rule is met on the half that has releases to
# count, and the other half is stated in the unit it actually has.
# Two consecutive bumps have now had the pair agree in exactly one
# direction, and this bump reverses which one — the compiler's half
# closed as the interpreter's opened.
#
# THE SHAPE IS NOT NEW, AND THIS FILE'S OWN HISTORY IS WHERE THAT WAS
# CHECKED. `git log -p -- wolf-toolchain.toml` carries the identical
# arrangement at `80a3d2b` (2026-09-03): wolf v0.2.4 `982f857` beside
# lupin 0.1.25 declaring `982f857`, with the compiler naming 0.1.24 —
# interpreter half zero, compiler half one, the same swap. The bs32
# contract's sentence for this file said "a gap of zero for the first
# time"; the log says otherwise, and the log wins. A book whose whole
# argument is that a claim gets executed does not get to hand-carry a
# superlative about its own pins. §1.2 and the colophon say what the
# stamps say and claim no firsts.
#
# WHAT THE BOOK MEASURED AT THIS PIN, prediction first (bs32):
#   * PREDICTED 0 FLIPS, in both directions and in the pending manifest,
#     with the reasoning written down before the runner ran. Only the
#     interpreter moved, so `lupin-run(…)` rows — which retire when the
#     COMPILER stops declining — could not move at all. The live
#     direction was the nine `wolf-run(…)` fences, and none of them
#     waits on anything 0.1.28 ships: ch18's four want `comptime fn`,
#     which this machine declines by design; §33.4's prefork wants
#     `net_adopt_listener` and a non-empty `os_spawn_with` inherit set;
#     ch30's three and ch22's one are the compiler's for reasons this
#     release does not touch. The three pending rows waiting on the
#     INTERPRETER's std subset (`sorted_by`/`take` at ch05/ex5-8, `par`
#     at ch13/ex13-1 and ch13/ex13-6) were the other live direction,
#     and 0.1.28 grows no std subset.
#   * MEASURED 0 FLIPS. 478 samples, 473 passed, 5 pending, 0 failed
#     once the two transcripts were re-recorded.
#   * 106 SAMPLES STILL RIDE ONE MACHINE, unmoved from bs31. This bump
#     retires no row of wolf-lang#268 and was never going to. Saying in
#     advance which bump can retire which row is what the prediction is
#     for; a bump that moves nothing is only worth reporting if
#     somebody said beforehand that it would not.
#   * 2 RUNNER MOVERS, both stamps, both the same edit: ch01 §1.2 and
#     the colophon. The compiler's two lines are byte-identical across
#     this bump; only the interpreter's line moves.
#   * ZERO diagnostic snapshots re-record, the catalog does not move
#     (169 codes), `grammar.ebnf` does not move, and the anchors stay
#     436. All four are wolf-lang's, and wolf-lang did not move.
#   * THE FOUR CALLS THIS MACHINE DECLINES BY DESIGN ARE STILL
#     DECLINED, and not one of them is a gap: `net_adopt_listener` and
#     a non-empty `os_spawn_with` inherit set (is38's reason — a
#     descriptor handed to "the program's child" would be handed to the
#     interpreter's child), `fs_fstat` (this machine has no filesystem,
#     wolf-interp#18 item 6, a verdict rather than an absence), and
#     `net_listen_with`'s `reuse_port`, which IS served here and is
#     printed as no run-block for chapter 33's windows reason.
#
# WHAT IS39 AND IS40 GIVE THE BOOK, which is one closed divergence and
# nothing else. `net_writev` and `net_nodelay` ([os.net.writev],
# [os.net.nodelay]) are mirrored here; chapter 33 teaches `net_write`,
# and neither call appears on a page or in an exercise (grepped, both
# directories). `sched` is admitted as this machine's twelfth
# namespace; Appendix D reads the SPECIFICATION's registry, not the
# interpreter's, so the page does not move. `budget_row` coarsens a
# fired `net_deadline` to the tag the call's DECLARED row carries, and
# §33.4's budgeted `net_accept` declares `timeout`, so the block's
# bytes are unchanged — predicted, then measured.
#
# THE §8.9 UNITS DO NOT MOVE and were not re-measured at this bump:
# is40's source motion is the two net calls, `budget_row`, the build
# stamp (#68) and the differ's self-profile refusal (#63). The object
# layout is untouched, as it was at 0.1.27, and bs29 re-measured the
# table against a release that did move it.
#
# D57 discipline: this rev IS the tag, so the interpreter's transcript
# stays clean; the compiler's does not, and [wolf] above owns why.
# #68 earns a line here because it is this organization's own build
# habit: in a git WORKTREE — which is how every lane in this org builds,
# including the one that made this bump — `.git` is a FILE, so 0.1.27's
# stamp-invalidation probe missed and the rerun-if-changed set was
# EMPTY. A branch move, a tag landing and a re-vendor were all invisible
# to it. 0.1.28 asks git where its metadata is. A book that prints a
# bare release string as proof that a binary was built at its tag has a
# direct interest in that probe being right.
repo = "wolffe-lang/wolf-interp"
rev = "e46597955fefe83f83a597d27cb3c4d489e61bef"
version = "lupin 0.1.28 (wolf-interp, reference interpreter at pin 5c729e8)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
# Bumped with the bs24 pin move (le05, wolf-lsp trunk). The bs13 pin
# predated s121: it knew no `char` type and no `'…'` literal, so every
# char literal in the book painted as body ink — the rendering gap
# bs13 recorded and bs23 re-stated at its closeout. This rev closes it.
# The vendored tmLanguage moves in exactly three places, all in
# wolf.tmLanguage.json (wolfi and wolf-pkg are byte-identical):
#   * a `chars` rule — `'a'`, `'\n'`, `'\x41'`, `'\u{1F41B}'` — scoped
#     `constant.character.wolf`, which is a NEW scope for the book's
#     map: highlight.rs gains `constant.character` → hl-string beneath
#     the `constant.character.escape` → hl-number entry that must keep
#     winning (first hit wins, so order is load-bearing).
#   * `char` joins the type keywords (`support.type.wolf`).
#   * attributes begin `#!?\[`, so an inner attribute `#![…]` paints
#     as an attribute instead of leaving `#!` as ink.
# What the tree-sitter grammar gained at le05 and the book does NOT
# see: `invalid_escape` (`@error`), `region_cap`, and the D67/D69
# separator work are tree-sitter nodes. The book's highlighter is the
# tmLanguage interpreter in xtask/src/tm.rs (highlight/README.md); the
# tree-sitter queries are the editors' path, not the book's. A
# `@error` entry in the book's palette waits on a tmLanguage rule that
# emits `invalid.illegal.*` — there is none at this rev, and the book
# holds no invalid escape in any rendered block to paint (measured:
# zero across 991 blocks), so the palette gains no error entry here.
# `cap`/`rc`/`pool` stay body ink: the spec calls them CONTEXTUAL
# keywords ([gram.inv.ctx]), which a regex grammar cannot tell from an
# identifier, so `region r(cap: n)` paints `region` and nothing else.
# That is correct, not a gap.
#
# TWO WRONG PAINTS carried at this pin, filed rather than worked around
# (the bs13 precedent: a rendering gap is recorded here, in the pin, not
# patched in the prose):
#   * wolf-lsp#4 — `raw-string` and `generalized-string` include
#     `#interpolation`, and the spec says both are raw-mode ([gram.lex.
#     str.raw], [gram.lex.str.gen]); tree-sitter agrees. So ch02 §2.2's
#     `r"C:\logs\{today}\wolf.log"` paints `{today}` as an interpolation
#     hole three lines above the sentence "the braces are two more
#     characters, not an interpolation", and the brace-balancer solution
#     paints its raw `r"([{}])"` data as syntax.
#   * wolf-lsp#5 — the interpolation hole's pattern list carries no
#     `#chars` and no `#strings`, so `"{(m + ('a' as int)) as char}"`
#     paints `as` and `char` but leaves `'a'` as ink, and `"{"total"}"`
#     leaves the nested literal as ink.
# Both are pre-existing at bs13's pin too; bs24 is the sprint that
# looked. Neither is worked around in the book.
repo = "wolffe-lang/wolf-lsp"
rev = "c97b81c36e23f53f539dad6de5e9e2a12c63c6e8"

