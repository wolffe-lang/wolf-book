#     interpreter beside it is 0.1.30, because the interpreter has
#     published twice since this compiler was built. This half read ONE
#     at the last bump and opens further.
#
# STILL NO SUPERLATIVE. The halves have now swapped direction on three
# consecutive bumps, and §1.2 and the colophon say which half is exact
# and by how much the other is off. They do NOT say this is a first:
# the pair has worn the exact-interpreter shape before, and this file's
# own history is where a claimed first was caught (the bs32 contract's
# "a gap of zero for the first time", which the log disproved).
