[wolf]
# wolf-lang at the v0.2.5 release tag. D57 (r03): a build made exactly
# at its own release tag prints the bare version with a pin clause —
# `wolf 0.2.5 (wolfgang, pin 6ade878)` — and every other build prints
# `+dev.<commit>` and claims nothing; unverifiable is dev. The stamp is
# the dist builder's, never a build script's (D33): `cargo xtask dist`
# probes git and sets WOLF_COMMIT/WOLF_RELEASE at compile time, so a
# plain `cargo build` at this same rev answers `0.2.5+dev.unknown`.
# The book's version transcripts print the bare release string, so the
# pinned wolf must be built with the dist builder or with its stamp
# reproduced (release profile, WOLF_COMMIT=6ade878 WOLF_RELEASE=v0.2.5
# — what book.yml's samples lane does; a debug build produces an
# unstamped binary and fails the two version transcripts).
#
# This bump (bs29) crosses s137 and the r08 release wave — the server
# gets its calls. What it changes for the book, measured at this tag:
#   * FIVE NEW CLAUSES AND NOT ONE PRINTED PAGE. `net_wait` (#127,
#     `[os.net.wait]`), `net_listen_with` (#234/#235,
#     `[os.net.listen.opts]`), `os_spawn_with` and
#     `net_adopt_listener` (`[os.proc.inherit]`), and `os_cpus` (#233,
#     `[os.cpus]`). This edition makes no `os_*` call and no socket
#     call anywhere. Counted over the export tree at this bump, THREE
#     os-tier builtins are executed on any page: `fs_write_text` 14,
#     `fs_read_text` 10, and `net_fetch` 4 — and every `net_fetch` is
#     there to be stopped, three refused at typecheck by E0701 (§18.4,
#     ex18-7c, ex24-4) and the fourth being the program §24.3's
#     `wolf audit` catches. Three more are NAMED and never run, in
#     26-6's discussion answer (`fs_open`, `fs_read`, `fs_close`). So
#     the release's headline surface lands entirely outside the book,
#     and this file is where it is recorded.
#   * A LOOP THAT WAITS AGAINST A LOOP THAT LOOKS, measured HERE
#     rather than quoted from the release note, because bs29's target 2
#     asked for the book's own transcript and found no page to put it
#     on. Three programs written for this bump, one connection held
#     open and idle for five seconds, native at this pin on this host
#     (macOS aarch64), `/usr/bin/time -l`, three runs each:
#
#                            loop passes   involuntary switches      cycles
#       deadline slicing         129-130           1,556-1,573   46.7-51.0 M
#       one net_wait on the set        1                 10-11    7.6-9.8 M
#       a program that only sleeps     —                   5-8    5.6-8.1 M
#
#     The switch column is the clean signal and it is three orders of
#     magnitude: a loop that time-slices a 25 ms deadline on the
#     listener and a 12 ms one on the connection is descheduled about
#     1,560 times to learn that nothing happened, where the loop that
#     waits is descheduled about ten times, which is what a program
#     that only sleeps costs. The cycle column carries about 2 M of
#     run-to-run noise on this host, so the honest reading of it is
#     that the waiting loop sits inside the sleeping program's spread
#     and the looking loop sits 40 M above it. wolf-lang's own note
#     reports 37x net of that floor from a bench harness; this is a
#     different instrument on a different day and the two are not
#     reconciled. NO PAGE PRINTS EITHER: see ch11's ledger row and
#     TOC.md's bs29 delta for where the paragraph is routed.
#   * The ANCHORS grow 417 -> 422: `os.cpus`, `os.net.listen.opts`,
#     `os.net.wait`, `os.proc`, `os.proc.inherit`. Nothing dropped,
#     nothing retargeted (both key sets diffed, per the is30 lesson),
#     and all six of Appendix D's unanchored tags are still unanchored.
#     Appendix D's document table moves with them, for the reason in
#     its own commit: it said the specification is seven documents and
#     the specification has been eleven for the whole 0.2 line, so the
#     one route this book gives a reader into the normative text did
#     not reach `os.*` at all.
#   * The catalog does NOT move: 169 codes at v0.2.4 and 169 here,
#     identical line for line, so `vendor/spec/diagnostic-codes.txt`
#     is unchanged and Appendix C's count stands. s137 minted no code
#     — its refusals are D30 error ROWS (`exists`, `unsupported`), not
#     diagnostics.
#   * The grammar does NOT move either: `grammar.ebnf` is byte-identical
#     to v0.2.4's, so Appendix A regenerates to itself.
#   * `wolf interface` embeds the toolchain version by design, so
#     ch22's interface transcript re-records (toolchain 0.2.4 -> 0.2.5,
#     both hashes with it), 22-9's solution with it, and ch25's publish
#     record carries the moved interface hash.
#   * THE FOUR FIXES touch nothing the book prints, and each was
#     checked rather than assumed. #238 (a diagnostic on a long line
#     aborting the compiler) needs a source line wider than the
#     renderer's 100-column window AND a diagnostic drawn on it: this
#     book's corpus is NOT held canonical under `wolf fmt`, so unlike
#     wolf-lang's it does carry such lines — 34 of them across 12
#     files, the widest 307 columns in `ex18-15` — and every sample
#     holding one is a green run at this pin, so no diagnostic is
#     drawn on any of them.
#     `channel[bool]` appears nowhere in the book (grepped: zero).
#     Nothing on any page spawns a child or hands over a descriptor.
#     The tier-2 build fix is a host the book does not run on.
#   * 4 runner movers at this bump, all classified, residue named and
#     healed by hand: the 2 version transcripts (ch01 §1.2, the
#     colophon), ch22's interface stamp, and ch25's publish record.
#     The residue is three sites the runner cannot see — 22-9's
#     solution transcript (the same embedded toolchain version,
#     re-measured rather than reasoned about), §1.2's two Windows
#     archive names, and §1.2's `wolf 0.2.4`/`0.2.4+dev.unknown`
#     sentence about the stamp. ZERO diagnostic snapshots re-record.
#
# This rev IS the tag, so the transcripts stay clean (D57).
repo = "wolffe-lang/wolf-lang"
rev = "6ade878c1f5f48bcb5c9ee804c749fbbc8634a02"
impl_version = "0.2.5"

[lupin]
# wolf-interp at the v0.1.26 release tag (is37): the stamped line names
# lupin 0.1.26 at pin 982f857. A lupin release's pin is the wolf-lang
# revision it was built and differentially tested against, and is37
# released against the v0.2.4 TAG — the revision this file pinned for
# wolf one sprint ago, not the one it pins now.
#
# THE TWO STAMPED LINES AGREE AGAIN, and the lag has changed ends.
# bs28's printing had them naming different interpreter releases: wolfc
# said `paired with lupin 0.1.24` while the interpreter beside it was
# 0.1.25. At this bump wolfc says
#
#   paired with lupin 0.1.26 (reference interpreter), pin 982f857
#
# which is exactly the interpreter this file pins, down to the pin
# clause, because v0.2.5 was cut AFTER 0.1.26 existed. What lags now is
# the other direction and it is quieter: 0.1.26 names 982f857, which is
# v0.2.4, so the interpreter was tested against the compiler BEFORE
# this one. The pair is one release apart either way; bs28's printing
# wore it on the release name, this one wears it on the sha. The
# colophon's paragraph and §1.2's are rewritten to say the thing that
# is true here rather than the thing that was true there, and the
# colophon keeps the sentence it has carried since the first edition,
# because a printing whose halves are cut on their own schedules is
# still the ordinary case.
#
# wolf-interp#62 CLOSES, and bs28's prediction is re-run rather than
# recalled. The gap was that `byte` resolved but `0..=255` was not
# enforced: at 0.1.25 `(mut bs).push(256)` into a `List[byte]` stored
# 256 and exited 0 where wolfc refused it by name. Measured here at
# this pin on that same three-line program:
#
#   lupin 0.1.25  ->  prints `1`, exit 0
#   lupin 0.1.26  ->  E0401 at 3:19, the D72 teach-note, exit 2
#   wolf  0.2.5   ->  E0401 at 3:19, exit 1
#
# Same rule, same span, each in its own words — is37 put it at two
# rungs, `sema::byte_check` at resolve and an `ElemTy` on the list at
# run. bs28 PREDICTED that zero of this book's samples could reach the
# gap and measured zero; the same prediction is re-run at its closing
# and is zero again, which is the reading that matters, because a gap
# closing can move a page as easily as a gap opening. The corpus reason
# is unchanged and was re-checked: the book pushes into no `List[byte]`
# anywhere (the one construction, §8.9's `let e = List[byte]()`, is
# measured empty and never appended to), writes no `let b: byte = <int>`
# annotation, and hands a `List[byte]` only to a parameter declared over
# one (13-11's substring search). The only int-to-byte flows on any page
# are the seven explicit `as byte` casts of §2.3's own program — four of
# them the narrowing ones that print 255/0/44/255 — and the rule
# excludes an explicit cast by clause: `[type.byte.cast]` keeps the low
# eight bits and never traps. At the raw bump, before a line was healed, `cargo xtask
# samples` on this host reported 462 passed / 5 pending / 4 failed / 0
# flips, and all four failures are the version and hash stamps of the
# COMPILER's move. Nothing in this file's interpreter half moved a page.
#
# THE §8.9 UNITS DO NOT MOVE, re-measured rather than carried forward.
# The section's own program with the numbers printed instead of the
# relations, both machines, this host (macOS aarch64):
#
#           header   65,536 octets   the same as List[int]
#   wolf        48          65,584               1,048,560
#   lupin       32          65,568               2,097,120
#
# Byte for byte bs28's table. So the multiple the page names is still
# sixteen compiled and thirty-two interpreted, and the sentence that
# says so needs no edit at this bump.
#
# WHAT IS37 CHANGED FOR OTHER REPOSITORIES AND NOT FOR THIS ONE: the
# eight wolf-std rows that carried `divergent(…)` and the two corpus
# twins beside them all flip to agreement, and E0301's note now renders
# the closed set of built-in type names from the check's own table. The
# book meets neither — it holds no wolf-std row and prints no E0301 —
# and wolf-interp#59's layout verification confirms by test what bs28
# already measured on §2.2's own program, so §2.2's E0104 is unchanged
# and Appendix C's `Shown by` column still says `wolf`.
#
# D57 discipline: this rev IS the tag, so the transcript stays clean.
repo = "wolffe-lang/wolf-interp"
rev = "5e774a2764dd37137b1af41cc4c4e1e1ca0afb8e"
version = "lupin 0.1.26 (wolf-interp, reference interpreter at pin 982f857)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
# Bumped with the bs24 pin move (le05, wolf-lsp trunk). The bs13 pin
# predated s121: it knew no `char` type and no `'…'` literal, so every
# char literal in the book painted as body ink — the rendering gap
# bs13 recorded and bs23 re-stated at its closeout. This rev closes it.
# The vendored tmLanguage moves in exactly three places, all in
# wolf.tmLanguage.json (wolfi and wolf-pkg are byte-identical):
#   * a `chars` rule — `'a'`, `'\n'`, `'\x41'`, `'\u{1F41B}'` — scoped
#     `constant.character.wolf`, which is a NEW scope for the book's
#     map: highlight.rs gains `constant.character` → hl-string beneath
#     the `constant.character.escape` → hl-number entry that must keep
#     winning (first hit wins, so order is load-bearing).
#   * `char` joins the type keywords (`support.type.wolf`).
#   * attributes begin `#!?\[`, so an inner attribute `#![…]` paints
#     as an attribute instead of leaving `#!` as ink.
# What the tree-sitter grammar gained at le05 and the book does NOT
# see: `invalid_escape` (`@error`), `region_cap`, and the D67/D69
# separator work are tree-sitter nodes. The book's highlighter is the
# tmLanguage interpreter in xtask/src/tm.rs (highlight/README.md); the
# tree-sitter queries are the editors' path, not the book's. A
# `@error` entry in the book's palette waits on a tmLanguage rule that
# emits `invalid.illegal.*` — there is none at this rev, and the book
# holds no invalid escape in any rendered block to paint (measured:
# zero across 991 blocks), so the palette gains no error entry here.
# `cap`/`rc`/`pool` stay body ink: the spec calls them CONTEXTUAL
# keywords ([gram.inv.ctx]), which a regex grammar cannot tell from an
# identifier, so `region r(cap: n)` paints `region` and nothing else.
# That is correct, not a gap.
#
# TWO WRONG PAINTS carried at this pin, filed rather than worked around
# (the bs13 precedent: a rendering gap is recorded here, in the pin, not
# patched in the prose):
#   * wolf-lsp#4 — `raw-string` and `generalized-string` include
#     `#interpolation`, and the spec says both are raw-mode ([gram.lex.
#     str.raw], [gram.lex.str.gen]); tree-sitter agrees. So ch02 §2.2's
#     `r"C:\logs\{today}\wolf.log"` paints `{today}` as an interpolation
#     hole three lines above the sentence "the braces are two more
#     characters, not an interpolation", and the brace-balancer solution
#     paints its raw `r"([{}])"` data as syntax.
#   * wolf-lsp#5 — the interpolation hole's pattern list carries no
#     `#chars` and no `#strings`, so `"{(m + ('a' as int)) as char}"`
#     paints `as` and `char` but leaves `'a'` as ink, and `"{"total"}"`
#     leaves the nested literal as ink.
# Both are pre-existing at bs13's pin too; bs24 is the sprint that
# looked. Neither is worked around in the book.
repo = "wolffe-lang/wolf-lsp"
rev = "c97b81c36e23f53f539dad6de5e9e2a12c63c6e8"

