[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
# Bumped with the bs24 pin move (le05, wolf-lsp trunk). The bs13 pin
# predated s121: it knew no `char` type and no `'…'` literal, so every
# char literal in the book painted as body ink — the rendering gap
# bs13 recorded and bs23 re-stated at its closeout. This rev closes it.
# The vendored tmLanguage moves in exactly three places, all in
# wolf.tmLanguage.json (wolfi and wolf-pkg are byte-identical):
#   * a `chars` rule — `'a'`, `'\n'`, `'\x41'`, `'\u{1F41B}'` — scoped
#     `constant.character.wolf`, which is a NEW scope for the book's
#     map: highlight.rs gains `constant.character` → hl-string beneath
#     the `constant.character.escape` → hl-number entry that must keep
#     winning (first hit wins, so order is load-bearing).
#   * `char` joins the type keywords (`support.type.wolf`).
#   * attributes begin `#!?\[`, so an inner attribute `#![…]` paints
#     as an attribute instead of leaving `#!` as ink.
# What the tree-sitter grammar gained at le05 and the book does NOT
# see: `invalid_escape` (`@error`), `region_cap`, and the D67/D69
# separator work are tree-sitter nodes. The book's highlighter is the
# tmLanguage interpreter in xtask/src/tm.rs (highlight/README.md); the
# tree-sitter queries are the editors' path, not the book's. A
# `@error` entry in the book's palette waits on a tmLanguage rule that
# emits `invalid.illegal.*` — there is none at this rev, and the book
# holds no invalid escape in any rendered block to paint (measured:
# zero across 991 blocks), so the palette gains no error entry here.
# `cap`/`rc`/`pool` stay body ink: the spec calls them CONTEXTUAL
# keywords ([gram.inv.ctx]), which a regex grammar cannot tell from an
# identifier, so `region r(cap: n)` paints `region` and nothing else.
# That is correct, not a gap.
#
# THE TWO WRONG PAINTS THAT BLOCK ABOVE RECORDED ARE FIXED, AND THIS
# BUMP IS THE RE-PIN THAT TAKES THE FIX. They were filed rather than
# worked around (the bs13 precedent: a rendering gap is recorded here,
# in the pin, not patched in the prose), and the prose they distorted
# never moved, so nothing has to be un-patched now.
#   * wolf-lsp#4 — `raw-string` and `generalized-string` included
#     `#interpolation`, and the spec says both are raw-mode ([gram.lex.
#     str.raw], [gram.lex.str.gen]); tree-sitter agreed. So ch02 §2.2's
#     `r"C:\logs\{today}\wolf.log"` painted `{today}` as an
#     interpolation hole three lines above the sentence "the braces are
#     two more characters, not an interpolation", and the brace-balancer
#     solution painted its raw `r"([{}])"` data as syntax. Both rules
#     now carry `"patterns": []`, so a raw literal is one green run.
#   * wolf-lsp#5 — the interpolation hole's pattern list carried no
#     `#chars` and no nested string rule, so `"{(m + ('a' as int)) as
#     char}"` painted `as` and `char` but left `'a'` as ink, and
#     `"{"total"}"` left the nested literal as ink. The hole's list
#     gains `#chars` and a new `interpolated-string` rule after
#     `#format-spec`.
#
# THE MOVE IS c97b81c -> d194486 (wolf-lsp trunk, ANCESTOR of the old
# pin checked rather than assumed, 86 commits). Eighty-six commits and
# the vendored bytes move in ONE FILE and THREE PLACES, which is the
# whole reason this is a re-pin and not a rendering sprint:
# `wolf.tmLanguage.json` gains `interpolated-string`, empties the two
# raw patterns, and extends the hole's list; `wolfi.tmLanguage.json` and
# `wolf-pkg.tmLanguage.json` are byte-identical, as at every bump. The
# operator alternation is unchanged, so no literal-form fragment starts
# painting as a keyword.
#
# `theme/highlight.css` DOES NOT MOVE, predicted from the scope map
# before `grammar-sync` ran and measured after. Neither changed rule
# introduces a scope the book has no entry for: the new
# `interpolated-string` is `string.quoted.double.wolf`, which the
# `string.` prefix already claims for hl-string, and `#chars` is
# `constant.character.wolf`, which bs24's `constant.character` entry
# already claims — and that entry must stay BELOW
# `constant.character.escape`, which is the ordering note above and is
# now load-bearing for a second reason.
#
# NO SAMPLE AND NO CONSOLE BLOCK MOVES AT THIS BUMP. A grammar re-pin
# changes what the rendered page looks like and nothing about what the
# tools do, so the samples runner cannot see it; the render lane is the
# lane that grades it.
repo = "wolffe-lang/wolf-lsp"
rev = "d194486e78478b6a744402e541ba2d112a0dac05"

