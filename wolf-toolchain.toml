#
#   wolf 0.2.8+dev.2c03ed9 (wolfgang, pin 2c03ed9)
#   paired with lupin 0.1.28 (reference interpreter), pin 5c729e8
#   lupin 0.1.30 (wolf-interp, reference interpreter at pin 2c03ed9)
#
# THE PAIR AGREES IN ONE DIRECTION AND THE HALVES SWAPPED AGAIN. Both
# computed from the two stamps, never hand-written (ww16):
#
#   THE INTERPRETER'S HALF IS ZERO, and exactly zero: it names the
#     revision this file pins, character for character. It read TEN
#     COMMITS at the last bump and closes here.
