# The pinned toolchain the book is true for (bs00 contract, target 2).
# Bumps are deliberate, in their own commit, CI-green — same policy as
# wolf-lang s00's rust-toolchain. The colophon repeats these values; the
# doc-truth CI job compares them.

[wolf]
# wolf-lang at the v0.2.2 release tag. D57 (r03): a build made exactly
# at its own release tag prints the bare version with a pin clause —
# `wolf 0.2.2 (wolfgang, pin 8cda3aa)` — and every other build prints
# `+dev.<commit>` and claims nothing; unverifiable is dev. The stamp is
# the dist builder's, never a build script's (D33): `cargo xtask dist`
# probes git and sets WOLF_COMMIT/WOLF_RELEASE at compile time, so a
# plain `cargo build` at this same rev answers `0.2.2+dev.unknown`.
# The book's version transcripts print the bare release string, so the
# pinned wolf must be built with the dist builder or with its stamp
# reproduced (release profile, WOLF_COMMIT=8cda3aa WOLF_RELEASE=v0.2.2
# — what book.yml's samples lane does; a debug build produces an
# unstamped binary and fails the two version transcripts). At THIS tag
# `cargo xtask dist` unpacks its own archive and builds and runs
# `corpus/hello.lu` from it on every host it serves.
#
# This bump (bs23) crosses s60a + s131 + s132 + s133 plus the r05
# release wave — the learners' release. Three headlines reach the book.
#
# What the bump changes for the book, measured at this tag:
#   * WINDOWS COMPILES. `wolf build hello.lu` writes `hello.exe` and
#     `wolf run hello.lu` compiles and executes it, natively, on
#     windows x86-64 — every release through v0.2.1 refused that host
#     by name. One thing must be installed beside it (Visual Studio
#     Build Tools, "Desktop development with C++"), and without it the
#     driver refuses BEFORE the link, in words that name what to
#     install. ch01 §1.2 gains the archive path, mirroring
#     lupp.us/install/ — which is itself measured weekly on a Windows
#     runner against the published archive. The book's own samples
#     lane cannot replay a Windows console block on this box, so those
#     blocks are quoted from the measured page and marked as such.
#   * THE REGION ANSWERS AND HOLDS. `region_bytes(r)` and
#     `live_region_bytes()` surface the ledger `wolf_rt` has kept
#     since s76, and `region r(cap: n)` bounds it. The clause leaves
#     the UNITS a per-tier measured fact and pins the RELATIONS, so
#     ch08's new §8.9 teaches relations and derives its budget from a
#     measured reading. A charge past the budget is trap
#     (alloc-contract) at the allocating site; inside a proc the trap
#     is contained at the boundary and reaches the join as
#     `fault(kind)` — `is_fault()` / `is_alloc_contract()`.
#   * THE COMMA INSISTS. D67's pattern family and D69's literals,
#     closure parameters and inline-C capture lists all refuse the
#     comma-less spelling now, at E0201, with a machine-applicable
#     "add the comma" fix. Blast radius across the world was measured
#     first and was zero working code — wolf-book's 1,129 files
#     included. §4.2 shows the refusal and the fix.
#   * A trap runs no defers, at the root too ([conf.trap.exit], #209).
#     MEASURED DIVERGENCE, recorded rather than hidden: every wolfc
#     lane abandons a pending root defer; lupin 0.1.22 runs it. ch04
#     §4.3 teaches the letter with wolfc's transcript and names the
#     interpreter's lag in tool voice (is34 closes it).
#   * The anchors grow 404 -> 411: [mem.region.account] with .1/.2 and
#     [mem.region.cap] with .1/.2/.3 register. The grammar gains
#     STR_ESC (with UNI_ESC beside it and CHAR_ESC derived from both),
#     `region_cap` on all three region forms, and D67's tightened
#     struct-pattern member list; Appendix A regenerates on all three.
#   * The catalog does NOT move: 169 codes at v0.2.1 and 169 at
#     v0.2.2, identical. The comma work reuses E0201 and the cap
#     breach is a trap, not a diagnostic. Appendix C's count stands.
#   * `wolf interface` embeds the toolchain version by design, so
#     ch22's interface transcript re-records (toolchain 0.2.1 ->
#     0.2.2, both hashes move with it), and ch25's publish record
#     carries the same moved interface hash.
#   * 4 runner movers at this bump, all classified, residue empty: the
#     2 version transcripts (ch01 §1.2, the colophon), ch22's
#     interface stamp, and ch25's publish record. Samples hold at
#     452 passed / 5 pending / 0 failed with zero pending flips before
#     the sprint's own additions.
#
# This rev IS the tag, so the transcripts stay clean (D57).
repo = "wolffe-lang/wolf-lang"
rev = "8cda3aa41004775bb4a4c0a600d7fb673143b7d0"
impl_version = "0.2.2"

[lupin]
# wolf-interp at the v0.1.22 release tag (is33): the stamped line names
# lupin 0.1.22 at pin 2bfbe5e. A lupin release's pin is the wolf-lang
# revision it was built and differentially tested against; no v0.2.2 tag
# existed at the is33 release step, so the pin is wolf-lang's s132 merge
# sha. The compiler's pairing line names lupin 0.1.22 at that same
# 2bfbe5e, so both lines agree, as they have since the 0.2.1 bump.
#
# What 0.1.21 + 0.1.22 carry, as the book meets them:
#   * The region ledger and the cap, whole-pipe: `region_bytes(r)`,
#     `live_region_bytes()`, `region r(cap: n)` and `region(cap: n)`,
#     the breach as trap(alloc-contract) at the allocating site, the
#     contained proc trap reaching the join as `fault(alloc-contract)`,
#     and free-then-deliver teardown. The book's ch08 §8.9 and ch14
#     transcripts run on this machine.
#   * The comma: lupin always refused the comma-less spellings, so
#     D67/D69 change nothing here. It is wolfgang that moved to meet
#     it, which is why §4.2's refusal is shown under the compiler.
#   * DIVERGENCE, NAMED (wolf-lang#209, is34's to close). A trap in
#     the ROOT domain runs no pending defers on every wolfc lane;
#     lupin 0.1.22 runs them. The two machines are verdict-identical
#     (`trap(assert)`) and the differential record cannot see the
#     difference, because a trapping program's record carries no
#     stdout. ch04 §4.3 teaches the spec's letter with the compiler's
#     transcript and states the interpreter's lag in tool voice; it
#     does not print an interpreter transcript that would read as the
#     rule.
#   * Census at this release: 479 files / 446 entries / 33 members;
#     every one of the 474 files carried from 0.1.21 is
#     verdict-identical, class for class.
# D57 discipline: this rev IS the tag, so the transcript stays clean.
repo = "wolffe-lang/wolf-interp"
rev = "753d686b923859562a6dd443d2bfbba3c06db745"
version = "lupin 0.1.22 (wolf-interp, reference interpreter at pin 2bfbe5e)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
# Bumped with the bs13 pin move: the grammar at this rev carries the
# full operator set and the numeric-type keywords (the old pin knew
# `Self|bool|int|str` and a fraction of the operators). It does NOT yet
# know `char` or the `'…'` literal — s121 postdates it — so char code
# highlights as plain text until wolf-lsp regenerates its grammar; a
# rendering gap, not a truth gap, and it rides the next wolf-lsp bump.
repo = "wolffe-lang/wolf-lsp"
rev = "2b89cfbd0071aa9aa26d18b0483334743faeb29e"

