# WHY A DEV PIN, WHICH IS A COST AND IS PAID DELIBERATELY. r11 put
# `str.to_int()` in the builtin set spelling its row `NotAnInt`, which
# s142 copied from the reference interpreter. `[mem.str.parse]` rules
# otherwise at this revision: payload-free marks are lowercase words
# and CapCase names a payload's type, `NotAnInt` was the one CapCase
# payload-free mark on the builtin surface, and W0603 — the compiler's
# own lint — warns a program that writes one. The mark is `parse` now.
# Chapter 1 §1.5 PRINTS that mark, so the chapter is wrong at the
# release tag and right one commit past it, and the two-machine rig
# says so out loud rather than letting the page drift: the block is
# `wolf-run(exit=1, stdout="error: parse")`, §1.5 carries the
# per-machine note, and the fence FLIPS back to `run(…)` on the day
# the interpreter spells the mark the same way (wolf-interp is41,
# wolf-lang#265). The reader's cost is stated on the page: an archive
# unpacked from the 0.2.8 release page answers with the bare version
# and not the `+dev` line §1.2 prints, and §1.2's "Getting them" says
# so beside the archives rather than leaving a reader to find it.
#
# WHAT THIS REVISION CHANGES FOR THE BOOK, prediction first:
#   * PREDICTED 9 FLIPS, by construct, from the release's own
#     changelog and before the runner ran: the interpolation family's
#     four (ch05 §5.1's `{last}` block, exercise 5-1, ch14's and
