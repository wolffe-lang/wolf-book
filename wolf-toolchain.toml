# The pinned toolchain the book is true for (bs00 contract, target 2).
# Bumps are deliberate, in their own commit, CI-green — same policy as
# wolf-lang s00's rust-toolchain. The colophon repeats these values; the
# doc-truth CI job compares them.

[wolf]
# wolf-lang at the v0.2.4 release tag. D57 (r03): a build made exactly
# at its own release tag prints the bare version with a pin clause —
# `wolf 0.2.4 (wolfgang, pin 982f857)` — and every other build prints
# `+dev.<commit>` and claims nothing; unverifiable is dev. The stamp is
# the dist builder's, never a build script's (D33): `cargo xtask dist`
# probes git and sets WOLF_COMMIT/WOLF_RELEASE at compile time, so a
# plain `cargo build` at this same rev answers `0.2.4+dev.unknown`.
# The book's version transcripts print the bare release string, so the
# pinned wolf must be built with the dist builder or with its stamp
# reproduced (release profile, WOLF_COMMIT=982f857 WOLF_RELEASE=v0.2.4
# — what book.yml's samples lane does; a debug build produces an
# unstamped binary and fails the two version transcripts).
#
# This bump (bs27) crosses s135 + s136 and the r07 release wave — the
# byte ships. What it changes for the book, measured at this tag:
#   * A NEW SCALAR, `byte` (D72, wolf-lang#203). Eight bits, unsigned,
#     `0..=255`, one byte of storage, and NOT an integer type: the
#     posture is `char`'s ([type.byte] is modelled on [type.char]).
#     No literal adoption — `65 as byte` is the only spelling — no
#     closed arithmetic (`b + 1` is an `int`, [type.byte.op]), and the
#     casts are ruled both ways: `byte as int` widens by
#     zero-extension, `int as byte` truncates to the low eight bits
#     and is the one narrowing `as` in the language that never traps
#     ([type.byte.cast]).
#   * THE PRODUCERS SPEAK BYTES (#231, s136). `str.bytes()`,
#     `str_from_utf8`, `fs_read_bytes`, `fs_write_bytes`,
#     `fs_read_chunk`, `fs_write_chunk`, `net_read_bytes` and
#     `net_write_bytes` are declared over `List[byte]` where they were
#     `List[int]`. This is the release's breaking change and the
#     book's blast radius, measured HERE at the bump, before a line was
#     healed: **98 refusals across 17 files** — 47 comparisons of a
#     byte against an int literal (E0401), 43 match-arm literals over a
#     byte scrutinee (E0401), 6 `List[byte]` values handed to a
#     `List[int]` parameter (E0401), and 2 `b as wrapping[i32]` casts
#     outside the ruled bridge (E0805). wolf-lang#231's release note
#     says 87 in 13 of wolf-book's files, counted from that side; this
#     is 98 in 17, counted here by compiling every program in the
#     export tree at the new pin and reading the compiler's own
#     diagnostics. The two are not reconciled site by site and no claim
#     is made that they should be — a count taken by pattern over a
#     repository and a count taken from a type-checker's output are
#     different measurements. The one that governs this sprint is the
#     one the compiler makes HERE, and it is 98, healed to zero: `b as
#     int` where the byte meets a number, `List[byte]` where a
#     signature followed the producer, `b as int as wrapping[i32]`
#     where the width is not one the byte bridges to.
#   * A READ CHARGES WHAT IT HOLDS. The same 64 KiB of octets that
#     charged 1,048,560 ledger bytes at v0.2.3 charge 65,584 here (one
#     list header plus the payload, minted at exact capacity), measured
#     natively on this book's own probe. §8.9's warning that ledger
#     units are not payload bytes still holds for every other element
#     type, and it now has a measured exception with a name.
#   * UNIX-DOMAIN SOCKETS (#227, `[os.net.unix]`). `net_listen_unix` /
#     `net_connect_unix` on linux and macOS, in the TCP pair's exact
#     shape; windows answers `unsupported` by name.
#     `corpus/net/unix_echo.lu` runs green here on macOS at this pin
#     (`unix sockets | served_or_named true | echo true | port_is_io
#     true | cleaned true`). NO PAGE PRINTS IT: this edition has no
#     network chapter and no `net_*` call on any page, so there is no
#     transport list for the family to join. Recorded here, where the
#     book records a toolchain fact it does not teach.
#   * D74 — ONE RULE PER STRING-LAYOUT CODE (#230). E0103 is the
#     delimiter rule (a `"""` shares its line with text, opening or
#     closing — the closing case used to answer E0104); E0104 is the
#     margin rule alone; E0105 is the tab/space rule, unchanged; E0102
#     owns the bare `{` in a plain string, where wolfc answered E0109.
#     A byte order mark at the very start of a file is stripped and is
#     never a diagnostic; anywhere else it is E0107. §2.2 teaches the
#     layout with the codes now, and Appendix C gains the rows.
#   * #222 CLOSES — ONE PATH SPELLING. `wolf add` and `wolf publish`
#     print slash-normalized paths on every host, like every diagnostic
#     in the same binary. This is the release samples-os.toml's two
#     remaining rows were waiting on, and they retire at this bump —
#     the windows lane FLIPS both first, by name, which is the rule
#     bs25 wrote them under.
#   * The anchors GROW 411 -> 417: `os.net`, `os.net.unix`,
#     `type.byte`, `type.byte.cast`, `type.byte.interp`,
#     `type.byte.op`. Nothing dropped, nothing retargeted (both key
#     sets diffed, per the is30 lesson), and all six of Appendix D's
#     unanchored tags are still unanchored.
#   * The catalog does NOT move: 169 codes at v0.2.3 and 169 here,
#     identical line for line. D74 re-ruled four codes and minted none;
#     E0805 and E0401 already existed. Appendix C's count stands.
#   * The grammar does NOT move either: `grammar.ebnf` is byte-identical
#     to v0.2.3's. `byte` is a builtin type NAME resolved in type
#     position, not a keyword — [gram.inv.kw]'s closed set stays at 50 —
#     so no production changed and Appendix A regenerates to itself.
#   * `wolf interface` embeds the toolchain version by design, so
#     ch22's interface transcript re-records (toolchain 0.2.3 -> 0.2.4,
#     both hashes with it), 22-9's solution with it, and ch25's publish
#     record carries the moved interface hash.
#   * 4 runner movers at this bump, all classified, residue empty: the
#     2 version transcripts (ch01 §1.2, the colophon), ch22's interface
#     stamp, and ch25's publish record. One hand-held record moves with
#     them and was re-measured rather than reasoned about: 22-9's
#     solution transcript (the same embedded toolchain version). ZERO
#     diagnostic snapshots re-record.
#
# This rev IS the tag, so the transcripts stay clean (D57).
repo = "wolffe-lang/wolf-lang"
rev = "982f857885b991e686c6b045de213d10cab013c1"
impl_version = "0.2.4"

[lupin]
# wolf-interp at the v0.1.24 release tag (is35): the stamped line names
# lupin 0.1.24 at pin 3befc3e. A lupin release's pin is the wolf-lang
# revision it was built and differentially tested against; is35 released
# against the v0.2.3 tag itself, so the pin is 3befc3e and not the
# v0.2.4 sha this file pins above. The compiler's pairing line names
# lupin 0.1.24 at that same 3befc3e, so both lines agree, as they have
# since the 0.2.1 bump.
#
# THIS IS THE ONE BUMP WHERE THE PAIRING IS HONESTLY BEHIND, and the
# book says so in the only place it can be measured — here. `byte`
# reached the mirror at is35, but the type landed at s135 and its
# producers at s136, both AFTER v0.1.24 was cut, so at this pin:
#   * `65 as byte` is E0301 on the interpreter ("nothing with this name
#     is in scope, so this cast names no target type"). Probed at the
#     bump, both directions.
#   * `b as int` over `s.bytes()` runs identically on both machines —
#     which is why the whole 98-site heal is a two-machine heal and not
#     one page went dark. The interpreter's `bytes()` still yields
#     `int`s, and an `int as int` is the identity cast it looks like.
#   * `let bs = s.bytes()` charges the interpreter's region ledger ZERO
#     where the compiled tier charges 65,584 for 65,536 octets. Probed
#     at the bump.
# Two blocks in this sprint are therefore the compiler's lane alone and
# are declared `wolf-run(…)` rather than `run(…)`: §2.3's cast
# transcript and §8.9's byte-ledger reading. That is the lane bs09
# opened for exactly this case — a program only one implementation
# runs, executed and byte-compared, never skipped. Both return to
# `run(…)` at the bump that takes is36.
#
# What 0.1.24 otherwise carries, as the book meets it:
#   * The `byte` type is spelled in the mirror's own surface (is35), so
#     the divergence is the cast and the producers, not the name.
#   * D74's half rides is36 and is NOT in this release: the interpreter
#     still answers E0109 where §2.2's page prints wolfc's E0104, and
#     it invents `E_BYTE_ORDER_MARK` under E0105 where the ruling says
#     a leading BOM is no diagnostic at all. §2.2's diagnostic block is
#     the compiler's rendering and says so in the `Shown by` column of
#     Appendix C, which is what that column is for.
# D57 discipline: this rev IS the tag, so the transcript stays clean.
repo = "wolffe-lang/wolf-interp"
rev = "294e75c1c9b9db8c7d65e0f346bd52407471210a"
version = "lupin 0.1.24 (wolf-interp, reference interpreter at pin 3befc3e)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
# Bumped with the bs24 pin move (le05, wolf-lsp trunk). The bs13 pin
# predated s121: it knew no `char` type and no `'…'` literal, so every
# char literal in the book painted as body ink — the rendering gap
# bs13 recorded and bs23 re-stated at its closeout. This rev closes it.
# The vendored tmLanguage moves in exactly three places, all in
# wolf.tmLanguage.json (wolfi and wolf-pkg are byte-identical):
#   * a `chars` rule — `'a'`, `'\n'`, `'\x41'`, `'\u{1F41B}'` — scoped
#     `constant.character.wolf`, which is a NEW scope for the book's
#     map: highlight.rs gains `constant.character` → hl-string beneath
#     the `constant.character.escape` → hl-number entry that must keep
#     winning (first hit wins, so order is load-bearing).
#   * `char` joins the type keywords (`support.type.wolf`).
#   * attributes begin `#!?\[`, so an inner attribute `#![…]` paints
#     as an attribute instead of leaving `#!` as ink.
# What the tree-sitter grammar gained at le05 and the book does NOT
# see: `invalid_escape` (`@error`), `region_cap`, and the D67/D69
# separator work are tree-sitter nodes. The book's highlighter is the
# tmLanguage interpreter in xtask/src/tm.rs (highlight/README.md); the
# tree-sitter queries are the editors' path, not the book's. A
# `@error` entry in the book's palette waits on a tmLanguage rule that
# emits `invalid.illegal.*` — there is none at this rev, and the book
# holds no invalid escape in any rendered block to paint (measured:
# zero across 991 blocks), so the palette gains no error entry here.
# `cap`/`rc`/`pool` stay body ink: the spec calls them CONTEXTUAL
# keywords ([gram.inv.ctx]), which a regex grammar cannot tell from an
# identifier, so `region r(cap: n)` paints `region` and nothing else.
# That is correct, not a gap.
#
# TWO WRONG PAINTS carried at this pin, filed rather than worked around
# (the bs13 precedent: a rendering gap is recorded here, in the pin, not
# patched in the prose):
#   * wolf-lsp#4 — `raw-string` and `generalized-string` include
#     `#interpolation`, and the spec says both are raw-mode ([gram.lex.
#     str.raw], [gram.lex.str.gen]); tree-sitter agrees. So ch02 §2.2's
#     `r"C:\logs\{today}\wolf.log"` paints `{today}` as an interpolation
#     hole three lines above the sentence "the braces are two more
#     characters, not an interpolation", and the brace-balancer solution
#     paints its raw `r"([{}])"` data as syntax.
#   * wolf-lsp#5 — the interpolation hole's pattern list carries no
#     `#chars` and no `#strings`, so `"{(m + ('a' as int)) as char}"`
#     paints `as` and `char` but leaves `'a'` as ink, and `"{"total"}"`
#     leaves the nested literal as ink.
# Both are pre-existing at bs13's pin too; bs24 is the sprint that
# looked. Neither is worked around in the book.
repo = "wolffe-lang/wolf-lsp"
rev = "c97b81c36e23f53f539dad6de5e9e2a12c63c6e8"

