#     program, extracted from the page and run under both interpreters:
#     0.1.28 prints `error: NotAnInt` and 0.1.29 prints `error: parse`,
#     both exit 1, and the compiler has printed `parse` since bs33. So
#     the two machines agree, the fence graduates to `run(…)`, §1.5's
#     per-machine note retires and its console transcript is `lupin`'s
