# wolf-book#39 asked for it the way the two toolchains are acquired.
# Four findings, all measured on the box at this file's own pins
# (wolf 0.2.12 (wolfgang, pin a7f517e), lupin 0.1.34, pin c9237c1):
#
#   1. THERE IS NOTHING TO PIN BY DIGEST. wolf-std publishes no release
#      and no tag: `gh api repos/wolffe-lang/wolf-std/releases` and the
#      same call for `/tags` both answer 0. Its own README tells a
#      reader to clone trunk and export WOLF_STD. A book that is true
#      for a published toolchain cannot pin a moving branch, and
#      vendoring a checkout is the thing this ledger exists to avoid.
#      (The repository is public, unlike the other three, so a
#      sha-pinned clone in CI is mechanically available the day there is
#      a reason to want one. There is not one yet — finding 4.)
#
#   2. THE COMPILER CANNOT COMPILE `std.sort` AT THIS PIN. With the std
#      on disk and the real API spelled, `wolf run --std-root <dir>`
#      answers
#        wolf run: cannot compile this yet — an enum or row test inside
#        a product pattern (deep trees, c06)
#      and exits 1. Reproduced on a two-element program, so it is the
#      module and not the caller. `sort` is the one module wolf-book#39
#      wants, so a std would not buy it.
#
#   3. THE INTERPRETER HAS NO STD AT ALL. lupin has no `--std-root` and
#      ignores WOLF_STD. `math.gcd(12, 18)` under `wolf run --std-root`
#      prints `6` and exits 0; the same file under lupin answers
#        unsupported: `math.gcd` does not resolve
#      and exits 4. STYLE.md: a `run(...)` fence is a claim about both
#      machines, so no std sample can ever be one. The most a std buys
#      this book is `wolf-run(...)`.
#
#   4. NOTHING WOULD READ IT. No sample in `book/` and no file under
#      `principles/exercises/` writes `use std.…` — every occurrence in
#      the tree is prose or a ledger row (ch05, ch24, ch25). A CI lane
#      that acquires a library no gate reads is the silent pass this
#      repository does not take.
#
# WHAT WOULD CHANGE THIS, any one of: wolf-std cuts a release this file
# can pin by digest; c06 lifts and `std.sort` compiles; or a chapter
# grows a `wolf-run(...)` sample needing a module the compiler already
# serves — `math`, `str` and `cmp` all resolve today. ch24's E1504
# std-facade row and ch25's §25.2 row are the two waiting consumers and
# ask for the same change.
#
# Measured against the wolf-std checkout at 4f796b1 (2026-09-11). That
# trunk moved while this was being measured; not chased, because a
# branch is not a pin.
