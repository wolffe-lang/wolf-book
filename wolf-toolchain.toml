[wolf]
# wolf-lang at the v0.2.6 release tag. D57 (r03): a build made exactly
# at its own release tag prints the bare version with a pin clause —
# `wolf 0.2.6 (wolfgang, pin 398e5f5)` — and every other build prints
# `+dev.<commit>` and claims nothing; unverifiable is dev. The stamp is
# the dist builder's, never a build script's (D33): `cargo xtask dist`
# probes git and sets WOLF_COMMIT/WOLF_RELEASE at compile time, so a
# plain `cargo build` at this same rev answers `0.2.6+dev.unknown` —
# re-measured here rather than carried forward, in a separate target
# directory so the stamped binary was not clobbered to learn it.
# The book's version transcripts print the bare release string, so the
# pinned wolf must be built with the dist builder or with its stamp
# reproduced (release profile, WOLF_COMMIT=398e5f5 WOLF_RELEASE=v0.2.6
# — what book.yml's samples lane does; a debug build produces an
# unstamped binary and fails the two version transcripts).
#
# This bump (bs30) crosses s138/s139 and the r09 release wave. It is
# the first bump in five whose headline surface lands ON A PRINTED
# PAGE: chapter 33 ships in the same sprint, so the paragraph bs29
# measured and routed is written, and the calls s137 gave the
# toolchain are executed by CI for the first time in this book's life.
# What this tag changes for the book, measured here:
#   * THE ACCEPT IS FAIR (#242, `[os.net.accept]`, new clause). A
#     listener now lives non-blocking under the runtime, `net_accept`
#     takes without blocking, and a hand that finds nothing there waits
#     again AGAINST THE SAME BUDGET — the one computed when the call
#     began — instead of re-entering a blocking `accept(2)` with its
#     deadline already spent. Before this release N hands on one shared
#     listener meant N-1 of them parked in the kernel until the NEXT
#     connection: microseconds on a busy server and never on a quiet
#     one. Nothing in `net_accept`'s signature or its rows moved, so
#     the guarantee a single hand can observe — with a budget armed the
#     call returns within it — is the same on both machines and at both
#     releases. THAT IS WHY chapter 33 can print the fix's history in
#     the past tense and its behaviour in the present: §33.4's runnable
#     block tests the shared guarantee, and the lost race itself is
#     stated from the release's own measurement (macOS arm64, three
#     hands free-for-all on one inherited listener, `ab -n 6000 -c 32`:
#     about 30,000 req/s before and after, the difference being what
#     happens when traffic stops) rather than re-measured here, because
#     this repository has no two-process sample rig.
#   * THE ANCHORS grow 422 -> 424: `conf.anchor.ns.admit` (#239) and
#     `os.net.accept` (#242). Nothing dropped, nothing retargeted —
#     BOTH key sets diffed in both directions, per the is30 lesson —
#     and all six of Appendix D's unanchored tags are still unanchored.
#   * THE NAMESPACE REGISTRY IS NOT THE DOCUMENT LIST, and Appendix D
#     is corrected for the difference. `[conf.anchor.ns]` at this tag
#     registers ELEVEN namespaces owned by TEN documents: #239 admitted
#     `diag`, `ct`, `type` and `os`, and 01-grammar.md owns two of them
#     (`gram` and `diag` §9). So the appendix's table gains `diag.*`
#     beside `gram.*` on document 01 — a tag a tool can print at a
#     reader with no row on the one page that routes them to the
#     normative text. The eleventh document, 07-schedule-points.md, is
#     the other correction: it declares `[sched.*]` anchors and stands
#     in NEITHER the clause's list nor the extractor's table at this
#     tag, so `anchors.json` publishes zero of them and `[conf.tag.valid]`
#     would reject a citation of one. The book cites none (grepped:
#     zero outside the table itself). The row now says so rather than
#     implying a prefix a reader can look up.
#   * The catalog does NOT move: 169 codes, identical line for line
#     against v0.2.6's own `docs/diagnostics.md`, so
#     `vendor/spec/diagnostic-codes.txt` is unchanged and Appendix C's
#     count stands. #242 minted no code — the fair accept changes when
#     an existing row is answered, not which rows exist.
#   * The grammar does NOT move either: `grammar.ebnf` is byte-identical
#     to v0.2.5's, so Appendix A regenerates to itself.
#   * `wolf interface` embeds the toolchain version by design, so
#     ch22's interface transcript re-records (toolchain 0.2.5 -> 0.2.6,
#     both hashes with it), 22-13's PAIR of runs with it — re-measured
#     on the exercise's own module, appended helper and all, and still
#     byte-identical between the two runs, which is the exercise's
#     whole point — and ch25's publish record carries the moved
#     interface hash.
#   * 4 runner movers at this bump, all classified, residue named and
#     healed by hand: the 2 version transcripts (ch01 §1.2, the
#     colophon), ch22's interface stamp, and ch25's publish record.
#     The residue is three sites the runner cannot see — 22-13's
#     solution transcript, §1.2's two Windows archive names, and
#     §1.2's `wolf 0.2.6`/`0.2.6+dev.unknown` sentence about the stamp.
#     ZERO diagnostic snapshots re-record.
#   * VENDORING NOTE. `vendor/spec/` is re-vendored FROM THE TAG, not
#     from the sibling working tree: at the time of this bump the
#     sibling checkout carried uncommitted s139 work (#246, which
#     registers `sched` and publishes its seven anchors). Those anchors
#     are not in this pin and are not vendored here. `cargo xtask
#     backmatter --check` compares against the sibling, so it disagrees
#     locally against a dirty checkout and agrees in CI, which clones
#     the pin.
#
# This rev IS the tag, so the transcripts stay clean (D57).
repo = "wolffe-lang/wolf-lang"
rev = "398e5f547a65308c6a3e88fee632563e87afd217"
impl_version = "0.2.6"

[lupin]
# wolf-interp at the v0.1.27 release tag (is38): the stamped line names
# lupin 0.1.27 at pin 6ade878. A lupin release's pin is the wolf-lang
# revision it was built and differentially tested against, and is38
# released against the v0.2.5 TAG — the revision this file pinned for
# wolf one sprint ago, not the one it pins now.
#
# THE LAG IS ONE AND IT SHOWS ON BOTH LINES. bs29's printing had the
# two stamps naming one interpreter with the lag hidden on the sha.
# At this bump both halves disagree, and both disagreements are the
# same disagreement:
#
#   wolf  0.2.6 (wolfgang, pin 398e5f5)
#   paired with lupin 0.1.26 (reference interpreter), pin 982f857
#   lupin 0.1.27 (wolf-interp, reference interpreter at pin 6ade878)
#
# The compiler names 0.1.26 where the interpreter beside it is 0.1.27;
# the interpreter names 6ade878, which is v0.2.5, where the compiler
# above it is 398e5f5. NEITHER HAD SEEN THE OTHER'S LATEST WHEN IT WAS
# TESTED, because the two releases were cut within a day of each other.
# One release apart, both directions. The colophon's paragraph and
# §1.2's are rewritten to say exactly that; nothing here claims the two
# are the same revision, and nothing here calls the lag two.
#
# WHAT IS38 GIVES THE BOOK, AND IT IS THE SPRINT'S WHOLE POINT: the
# s137 cores land in the mirror, so the calls chapter 33 teaches are
# executable ON BOTH MACHINES and the chapter's blocks are ordinary
# two-machine samples rather than compiler-only ones. Measured here at
# these pins on this host (macOS aarch64), each of the chapter's four
# runnable programs under `lupin` and under `wolf run`, stdout compared
# byte for byte:
#
#   §33.1  the door and one caller            AGREE
#   §33.2  net_wait over a set (four lines)   AGREE
#   §33.3  the loop, two callers, one process AGREE
#   §33.4  os_cpus and a budgeted accept      AGREE
#
# WHAT THE INTERPRETER DECLINES, and why §33.4's prefork program is a
# `wolf-run(…)` block rather than an ordinary one: `net_adopt_listener`
# and a non-empty `os_spawn_with` inherit set are declined by the
# checked machine BY NAME, with the construct named rather than the
# host blamed — `unsupported: listener adoption in checked execution`,
# measured on a three-line program at this pin. The reason is is38's
# and it is not a gap: lupin is a binary interpreting a program, so a
# descriptor handed to "the program's child" would be handed to the
# interpreter's child. `net_listen_with`'s `reuse_port` option, by
# contrast, IS served here — two hands on one loopback address answer
# the same port on both machines, measured — but it is not printed as a
# run-block either, for the windows reason recorded in chapter 33's
# ledger.
#
# THE FAIR ACCEPT IS THE COMPILER'S ALONE AT THIS PAIR, and the book
# says nothing that needs it. lupin 0.1.27 deliberately does not take
# wolf-lang v0.2.6 (its own changelog says so: r09's delta is one
# corpus file, spec/05's amendment, and `[os.net.accept]`, which is an
# implementation surface and not a mirror of anything is38 shipped), so
# the interpreter's accept is v0.2.5's. This costs the book nothing,
# and the reason is the shape of #242 itself: the fix changed what a
# LOST RACE costs, and a lost race needs two hands on one listener,
# which the interpreter refuses to arrange in the first place. The
# guarantee a single hand CAN observe — with a budget armed,
# `net_accept` returns within it — was already the contract at v0.2.5
# and is what §33.4's runnable block tests. Measured: both machines
# answer `timeout` on a 50 ms budget against a door nobody dials.
#
# TWO INTERPRETER POSTURES THE CHAPTER IS WRITTEN AROUND, neither of
# them a defect: the v0 net surface is LOOPBACK ONLY and a non-loopback
# bind is refused by name, and an unbounded `net_wait` is railed at ten
# seconds rather than allowed to hang a verdict. Every program in
# chapter 33 binds `127.0.0.1:0` and waits on a bounded deadline, which
# is the discipline the corpus already keeps and the one a reader
# should keep in a test anyway.
#
# THE §8.9 UNITS DO NOT MOVE and were not re-measured at this bump: the
# interpreter's object layout is untouched by is38 (the release's work
# is the s137 mirror and the differ's locus gate), and bs29 re-measured
# the table one sprint ago against a release that did move layout.
#
# D57 discipline: this rev IS the tag, so the transcript stays clean.
repo = "wolffe-lang/wolf-interp"
rev = "4d64d9010f71cb6cb21885a73bb5452ae1849607"
version = "lupin 0.1.27 (wolf-interp, reference interpreter at pin 6ade878)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
# Bumped with the bs24 pin move (le05, wolf-lsp trunk). The bs13 pin
# predated s121: it knew no `char` type and no `'…'` literal, so every
# char literal in the book painted as body ink — the rendering gap
# bs13 recorded and bs23 re-stated at its closeout. This rev closes it.
# The vendored tmLanguage moves in exactly three places, all in
# wolf.tmLanguage.json (wolfi and wolf-pkg are byte-identical):
#   * a `chars` rule — `'a'`, `'\n'`, `'\x41'`, `'\u{1F41B}'` — scoped
#     `constant.character.wolf`, which is a NEW scope for the book's
#     map: highlight.rs gains `constant.character` → hl-string beneath
#     the `constant.character.escape` → hl-number entry that must keep
#     winning (first hit wins, so order is load-bearing).
#   * `char` joins the type keywords (`support.type.wolf`).
#   * attributes begin `#!?\[`, so an inner attribute `#![…]` paints
#     as an attribute instead of leaving `#!` as ink.
# What the tree-sitter grammar gained at le05 and the book does NOT
# see: `invalid_escape` (`@error`), `region_cap`, and the D67/D69
# separator work are tree-sitter nodes. The book's highlighter is the
# tmLanguage interpreter in xtask/src/tm.rs (highlight/README.md); the
# tree-sitter queries are the editors' path, not the book's. A
# `@error` entry in the book's palette waits on a tmLanguage rule that
# emits `invalid.illegal.*` — there is none at this rev, and the book
# holds no invalid escape in any rendered block to paint (measured:
# zero across 991 blocks), so the palette gains no error entry here.
# `cap`/`rc`/`pool` stay body ink: the spec calls them CONTEXTUAL
# keywords ([gram.inv.ctx]), which a regex grammar cannot tell from an
# identifier, so `region r(cap: n)` paints `region` and nothing else.
# That is correct, not a gap.
#
# TWO WRONG PAINTS carried at this pin, filed rather than worked around
# (the bs13 precedent: a rendering gap is recorded here, in the pin, not
# patched in the prose):
#   * wolf-lsp#4 — `raw-string` and `generalized-string` include
#     `#interpolation`, and the spec says both are raw-mode ([gram.lex.
#     str.raw], [gram.lex.str.gen]); tree-sitter agrees. So ch02 §2.2's
#     `r"C:\logs\{today}\wolf.log"` paints `{today}` as an interpolation
#     hole three lines above the sentence "the braces are two more
#     characters, not an interpolation", and the brace-balancer solution
#     paints its raw `r"([{}])"` data as syntax.
#   * wolf-lsp#5 — the interpolation hole's pattern list carries no
#     `#chars` and no `#strings`, so `"{(m + ('a' as int)) as char}"`
#     paints `as` and `char` but leaves `'a'` as ink, and `"{"total"}"`
#     leaves the nested literal as ink.
# Both are pre-existing at bs13's pin too; bs24 is the sprint that
# looked. Neither is worked around in the book.
repo = "wolffe-lang/wolf-lsp"
rev = "c97b81c36e23f53f539dad6de5e9e2a12c63c6e8"

