# The pinned toolchain the book is true for (bs00 contract, target 2).
# Bumps are deliberate, in their own commit, CI-green — same policy as
# wolf-lang s00's rust-toolchain. The colophon repeats these values; the
# doc-truth CI job compares them.

[wolf]
# wolf-lang at M1 plus the concurrency runtime, the std unblock,
# `wolf test`, the warning system, the lived lint corpus, and
# deterministic checked-lane verdicts: `wolf build`/`wolf run` compile
# and execute real programs, and the runtime carries tasks, channels,
# select, `when`, and procs. The wave-four close put the `str` method
# set, `List` operations, value-position interpolation with format
# specs, and the nine `fs_*` builtins into native lowering, which is
# what makes Part 5's first three chapters buildable; wave five's first
# lane added the deterministic scheduler; the package manager (chapters
# 22, 23 and 24 are written on it), the idiom arbiter's eleven
# convention lints, argv and env, and the release tier arrived with the
# c09 wave.
#
# Native concurrency landed with the c09 wave: `scope`/`s.spawn`/
# `channel`/`select`/`freeze` lower and link, which is what Part 5's
# parallel grep and the solo are built on. The mid-end landed with it,
# and with it the fix for the select-arm dominance ICE (wolf-lang#64)
# that held this pin at a deliberate deviation for two sprints.
#
# This bump (bs10 pass three) crosses the two campaigns that closed the
# language's last interpreter-only claims, plus the hygiene wave between
# them: c19 finishes native concurrency (the release tier runs the
# eleven spawn-bearing corpus programs `func.addr` was holding off it; a
# proc spawned in a loop is sound because the runtime now copies the
# argument record the proc owns — `[abi.native.procenv]`), and c21 lands
# monomorphization (a generic free function, an inherent generic impl,
# a generic nominal's layout — all instantiate on one worklist, D8 dedup
# behind it). Between them: the byte-view lend (8 of 9 std.bytes
# functions cross without copying), E1015 retired INTO the catalog and
# its refusal downgraded to W1004 with the copy as the answer, the
# fail-pin ledger split into rules vs forward pins, and `cargo xtask
# peel` (the survey lens the mis-sized contracts of 08-19 forced into
# existence).
#
# What the bump changes for the book, measured at this sha:
#   * Chapter 29's gate LOSES ITS SECOND HALF: `pick(a, 0)` on a
#     `List[int]` compiles, links, runs, and prints the same 7 on both
#     lanes. What survives of the gate is its first half, unchanged and
#     re-measured — the `Pool` constructor refusal and the interpreter's
#     handle-write refusal, quoted fresh in the chapter's hold note.
#     (The EXPLICIT spelling `pick[int](a, 0)` still refuses — "a
#     generic function used as a value (comptime)" — a narrower fact
#     than the old note's, and recorded there.)
#   * Chapter 13's top ledger row half-closes: E1101 now catches the
#     `(mut xs).push` receiver-lend across a spawn (wolf-lang#71's
#     compiler half, fixed), while lupin 0.1.10 still runs the same
#     program to a write-dropping exit 0 — the divergence inverts
#     instead of closing. Filed as wolf-interp#30; the row narrows.
#   * The catalog grows six codes (E1015's own retirement page among
#     them, E1507–E1509, W1004, W1501); anchors grow taskenv, procenv
#     and the shebang clause. Vendored spec artifacts re-vendored.
#   * Zero snapshot movement: 386 samples pass with no re-capture, no
#     flip, and the version transcripts are byte-identical because
#     `wolf --version` still prints the 0.1.8 pairing line at this sha
#     (wolf-lang#87 — the rot is upstream's open issue, and it is why
#     the colophon does not move at this bump).
#
# The pairing asymmetry, named: lupin stays at 0.1.10, whose own
# version line names the PREVIOUS wolf pin (613c3dc). The two machines'
# releases pair one step apart by policy (§1.2 teaches the reader to
# read them that way); a lupin release naming this sha re-closes the
# symmetry when the interpreter next ships.
#
# One finding survives the bump unchanged: `w.link()`, the one-argument
# spelling chapter 15 teaches, still answers E0402 (`link` takes 1
# argument) — chapter 15's ledger carries it, wolf-lang#87 carries the
# version-line rot, and wolf-interp#30 now carries the capture-check
# half of what used to be chapter 13's compiler row.
#
# This sha is the newest one whose `ci` run is green AND on which the
# whole book suite is green, which is what the gate asks for.
repo = "wolffe-lang/wolf-lang"
rev = "2c6980a128fb8e3889931d65d64147e1136799e4"
impl_version = "0.1.0"

[lupin]
# wolf-interp at the v0.1.10 tag: runs programs, reports traps,
# evaluates REPL snippets, and is the implementation that executes
# Part 3 — the scheduler, the seeded decision stream, and the schedule
# explorer are all its. 0.1.6 brought the E11xx parity rejections that
# chapter 13 is written on; 0.1.7 pushed literals' int adoption, one
# admission ladder for `explore` and `run`, and ten idiom lints; 0.1.8
# landed the D39 write barrier (a write through a read-mode binding
# traps exclusivity) and the D40 loop-extent claim (mutation during
# iteration traps at the mutation).
# 0.1.9 is the conc-parity release, and it is the half of this bump the
# book cares about most: the two machines now both run wolf's
# concurrency and are compared on it — ten of ten conc entries agreeing
# on verdict, exit status and output bytes, seeded on both sides, with
# the thirteenth differential running 241 entries at zero divergences.
# Part 3's chapters were written when only one implementation could
# execute their programs; they are now differentially checked like the
# rest of the book.
# It is also the release pairing: the interpreter names the compiler sha
# it was differentially tested against, and the compiler names it back.
# 0.1.10 names the same compiler sha this file pins above, so the book,
# the compiler and the interpreter all describe one toolchain. It also
# closed the differential's biggest blind spot: the flagless comparison
# lane had been reaching `run` on none of the corpus, so the dynamic
# half was ledgered as uncompared; both machines now execute the corpus
# at all three tiers, and the release tier changed nothing observable.
# The rev is the annotated tag object (commit `c11c5ed`), matching the
# convention this file has used since 0.1.5. The tag's own CI run is
# green, and the whole book suite is green on it: the only movement at
# the bump is the two transcripts that print the version.
repo = "wolffe-lang/wolf-interp"
rev = "11650e6786a2898751087b7daba0eb495cd5847a"
version = "lupin 0.1.10 (wolf-interp, reference interpreter at pin 613c3dc)"

[wolf-lsp]
# Source of the vendored tmLanguage grammars under highlight/.
# `cargo xtask grammar-sync --check` fails on drift against this pin.
repo = "wolffe-lang/wolf-lsp"
rev = "dc05c271b683d1c8b544ab5fae74e66a4a034af7"

[wolf-repl]
# REPL transcript replay is pending(is08): wolf-repl blocks are counted
# and reported, never silently unchecked. Flip this to a rev when is08
# ships.
pending = "is08"
