# The pending manifest — the runner's twin of EXERCISES-PENDING.md.
# Every row names a corpus sample whose directive is EXPECTED to fail
# against today's pinned tools: the runner executes it report-only and
# treats a pass as a FLIP (hard error) so a landing feature is noticed
# in the same commit that bumps the pin. Rows are removed, never
# silently absorbed. Workflow-only pending exercises (21-8, 22-7,
# 23-7, 24-6, B-10) have no .lu file and no row; 20-5's program (19-1
# until the bs18 re-draw renumbered the contracts corpus) runs green
# today (its pending-ness is the unverified #[noalloc], not the run)
# so it carries no row either. Old 20-6, the bench-baseline workflow
# exercise, retired with its chapter at bs18 (EXERCISES-PENDING.md's
# re-draw note).
#
# Removed at the bs10 pin bump, both as reported FLIPs: `ch13/ex13-3`
# (E1101, unsynchronized mutable capture across tasks) and `ch16/ex16-9`
# (E1102, unsendable channel payload). Both codes exist in the compiler
# at this pin and both exercises are ordinary green samples with
# reviewed snapshots.
#
# REMOVED AT THE bs50 PIN BUMP (wolf 0.2.15 / lupin 0.1.37), both as
# reported FLIPs: `ch13/ex13-1` and `ch13/ex13-6`, the two `par` rows.
# `par` is implemented on BOTH machines at this pair — it is the
# language's own builtin (`[type.comb.builtin]`), not a std function,
# so it needs no std root and both tools serve it. lupin runs it
# sequentially and prints the same bytes, which `[conc.task.par.order]`
# makes conforming. Their section, §13.1, is written in the same
# commit range, which is what these two rows were holding.
#
# At the rp01 bump (lupin v0.1.6) the *interpreter* grew the same three
# checks — E1101, E1102, E1103 — refusing at the resolve rung with
# byte-identical codes and spans. No row moved, because none was waiting
# on it: both exercises had already flipped on the compiler's half.
# Recorded because it is what makes chapter 13 writable, and because a
# differential those rows rested on is gone — lupin no longer runs a
# racy capture to a silently wrong exit 0. The two ch13 rows left below
# are `par`'s, and they are what holds §13.1. bs49 re-pointed their
# owner from two 0.1-line sprint ids at wolf-lang#390, the ruling
# wolf-book#52 asked for: the spec still defines `[conc.task.par]` at
# 0.2.14 and neither machine implements it.

