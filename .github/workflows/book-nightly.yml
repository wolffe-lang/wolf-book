# Nightly drift watch (bs00 contract, target 2): build the samples
# against wolf-lang MAIN — report-only — so toolchain drift is visible
# before the next deliberate pin bump. A red nightly is information,
# not a gate; the job says SKIP/DRIFT loudly instead of failing the
# default branch.

name: book-nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  samples-against-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: wolf-book
      - uses: actions/checkout@v4
        with:
          repository: tenseleyFlow/wolf-lang
          ref: main
          path: wolf-lang
          token: ${{ secrets.WOLF_CI_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: tenseleyFlow/wolf-interp
          ref: main
          path: wolf-interp
          token: ${{ secrets.WOLF_CI_TOKEN || github.token }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            wolf-book
            wolf-lang
            wolf-interp
      - name: build tools at main
        shell: bash
        run: |
          (cd wolf-lang && cargo build --bin wolf && cargo build -p wolf_rt)
          (cd wolf-interp && cargo build --release --bin lupin)
      - name: samples against main (report-only)
        shell: bash
        working-directory: wolf-book
        env:
          WOLF: ${{ github.workspace }}/wolf-lang/target/debug/wolf
          LUPIN: ${{ github.workspace }}/wolf-interp/target/release/lupin
        run: |
          if cargo xtask samples; then
            echo "nightly: no drift — main still satisfies the book's directives"
          else
            echo "::warning::nightly DRIFT: wolf-lang/wolf-interp main no longer satisfies the book's directives — the next pin bump will need book updates (report-only lane, not a gate)"
          fi
