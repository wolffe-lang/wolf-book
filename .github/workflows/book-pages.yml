# GitHub Pages is NOT the book's home. The book lives at
# https://lupp.us/book/ (nginx on almanta, deployed from wolf-web).
#
# Until bs55 this workflow published a full copy of the web edition at
# https://wolffe-lang.github.io/wolf-book/ and called it production. It
# was never what readers saw: Pages sends none of lupp.us's headers, and
# under lupp.us's `script-src 'self'` the theme's inline scripts never
# ran, so the sidebar 404ed there from every page one directory down
# while the Pages copy worked. Two copies of one book, one of them
# unable to show the other's defects, is how that stayed hidden.
#
# So Pages now serves redirects only: every page of the render, at its
# own path, answers with `rel=canonical` plus a meta refresh (and one
# line of script that keeps a `#8.4` fragment) to
# https://lupp.us/book/<same path>; any other path (the PDF, a page that
# never existed) is forwarded by a 404 page. Old links keep working and
# point at the one home. `cargo xtask render pages` builds it.

name: book-pages

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: render the web edition, then one redirect per page
        shell: bash
        run: cargo xtask render pages
      - name: the redirects point home
        shell: bash
        run: |
          set -euo pipefail
          n=$(find target/render/pages -name '*.html' | wc -l)
          echo "pages: $n redirect files"
          grep -q '<link rel="canonical" href="https://lupp.us/book/ch33.html">' target/render/pages/ch33.html
          grep -q 'url=https://lupp.us/book/front/how-to-read.html' target/render/pages/front/how-to-read.html
          grep -q 'location.pathname' target/render/pages/404.html
          if grep -rl 'class="sidebar"' target/render/pages; then
            echo "::error::a page of the book, not a redirect, reached the Pages artifact"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/render/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
