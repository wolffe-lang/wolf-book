# The web edition's production home: GitHub Pages at
# https://wolffe-lang.github.io/wolf-book/. The web build is canonical
# (DESIGN.md §1), so the deploy is the same `cargo xtask render` the
# `book` workflow runs, published rather than uploaded as an artifact.
# It runs after a toolchain release too, because the book's claim is
# about a pin and a release moves pins.

name: book-pages

on:
  push:
    branches: [trunk]
  repository_dispatch:
    types: [toolchain-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: typst-community/setup-typst@v4
      # The PDF ships beside the web edition, from the same source, so a
      # reader who wants paper does not need a different build.
      - name: render web + wolf-book.md + wolf-book.pdf
        shell: bash
        run: cargo xtask render all --require-pdf
      - name: stage the download artifacts into the site
        shell: bash
        run: |
          cp target/render/wolf-book.pdf target/render/web/wolf-book.pdf
          cp target/render/wolf-book.md target/render/web/wolf-book.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/render/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
