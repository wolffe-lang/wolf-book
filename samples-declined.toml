# The declined-transcript ledger (bs41) — the third answer the corpus
# console lane can give about a block.
#
#   samples-pending.toml   "not yet, anywhere"
#   samples-os.toml        "not here, and here is exactly what here says"
#   samples-declined.toml  "not replayed at all, and here is what a
#                           replay of it would need"
#
# wolf-book#24 asked for two things and bs38 could only give the first:
# replay every exercise transcript, and name the ones it cannot. The
# naming was the runner's own — a sentence the RULE noticed ("`lupin`
# names no solution in this exercise directory"), which is true and
# says nothing about whether anyone looked. wolf-book#29 turned the
# remainder into a list by class; this file turns each entry of that
# list into a row, and the gate runs both ways:
#
#   * a corpus console block nothing replays, with no row here, FAILS
#     the samples lane. The book does not grow an unexplained hole.
#   * a row whose block REPLAYS now is stale and FAILS too, naming the
#     row to delete. A hole that closes is news.
#
# ONE DECLINE IS EXEMPT FROM BOTH DIRECTIONS, and the exemption is why
# `Decline::host_only` exists in xtask/src/console.rs: a block the unix
# lane replays and windows declines (a built binary, a linked `wolf
# build`) is a third of the matrix standing down, not a hole in the
# book. Those print as OFF-LANE and are never balanced against this
# file, which is what lets the same rows hold on all three hosts while
# the raw decline COUNT differs (20 on macOS and linux, 28 on windows
# at the bs41 pin; 18 rows here since bs44 closed three and bs47 added
# the doctrine page's one).
#
# WHAT BS41 TOOK, and why these twenty are what is left. #29 sorted 48
# declined blocks into five classes. Twenty-eight of them came in:
#
#   * the 24 `conform-run` blocks. #29 read them as wanting the
#     `diagnostic,from(id)` lane, because `wolf conform-run` prints its
#     protocol verdict on stdout while the pages paste the diagnostic
#     from stderr. Measured at this pin, that is a fact about a STREAM
#     and not about a verb: drop the one JSON line addressed to the
#     machine and the rest of what the tool said is exactly what the
#     page prints. Six of the twenty-four were the interpreter's
#     (`lupin conform-run … --explore=N`), which has no protocol half at
#     all and has replayed in book blocks since the console lane
#     existed — they were caught by a guard written for the compiler's
#     shape.
#   * the 4 `wolf --explain E…` blocks, admitted as the one command
#     with no file behind it that the corpus rule takes: no input, no
#     disk, no phase, and a catalog `verify-docs` already compares in
#     both directions.
#
# The rest were "the twenty", and the sentence that closed #29's last
# sweep — "none of them is a rule that could be widened; each wants
# something that is not in this repository" — is the one bs44 took
# apart. Three of the twenty wanted nothing but a path the rig can
# reach, and are gone from this file. Of the SEVENTEEN left, most are
# rules and not things: `--dir`, `Verb::Local`, an evaluated
# expression, a REPL. Exactly two want a file (ch01's `hello.lu`,
# ch26's `count.lu`) and both want a rule first.

# ---------------------------------------------------------------- file
# #29 §2, RE-READ AT BS44 AND THREE OF THE EIGHT CLOSED. The class was
# filed as "eight blocks whose prompt names a file or a package the
# corpus does not hold", with the fix named as fixtures. Measured, that
# premise did not survive: THREE of the eight named a file the corpus
# HAS ALREADY, under a path the prompt did not use, because each
# transcript was written from the directory a reader would be standing
# in and the rig replays from the chapter root.
#
#   * 22-13 — `wolf interface ./tokens/tokens.lu` is 22-9's `tokens`
#     module, which is `wordcount/tokens/tokens.lu` from the chapter
#     root. No fixture; a path. THIS IS THE BLOCK wolf-book#24 WAS
#     FILED OVER, and the stale toolchain stamp it rode through a green
#     build is now compared byte for byte every run.
#   * 22-9's and 22-10's `$ lupin main.lu` are `wordcount/main.lu` and
#     `calc/main.lu`, both checked in and both already executed as
#     corpus samples. One `main.lu` could never have served both, which
#     is the tell the fixture reading missed.
#
# WHAT IS LEFT IS NOT FIXTURES EITHER, and this is the correction #29
# most needs. Of the five below, exactly ONE (ch01's `hello.lu`) is a
# missing file, and even that one wants a warm `.lu-cache/` and prints
# a key the page itself says will differ. The other four are blocked by
# the corpus RULE, not by the disk:
#
#   * ch23's and ch24's blocks carry no `.lu` argument at all (`wolf
#     tree --dir app`), and the corpus rule admits a `wolf`/`lupin`
#     command only when it names a `.lu` that exists. A checked-in
#     `app/` would change nothing until the rule takes `--dir`.
#   * ch26's runs `./count`, which is the `Verb::Local` widening the
#     `binary-or-shell` rows below are waiting on; the missing
#     `count.lu` is the second blocker, not the first.
#   * ch22-11's pair CANNOT BE CHECKED IN AT ALL, by specification.
#     The block demonstrates D32: an unmarked sibling joins the module
#     and its `main` collides (E0302). Every `.lu` the corpus sweep
#     admits must carry `//! check:` and `//! phase:` — and
#     `[conf.directive.standalone]` (D59, s124) says a file whose
#     leading `//!` block carries BOTH of those is a standalone entry
#     that never joins its directory's module. Measured on both
#     machines at this pin: the pair runs clean and E0302 never fires.
#     The corpus's own admission rule forbids the one shape this
#     exercise is about.

[[declined]]
block = "principles/exercises/ch01/EXERCISES.md:145"
class = "file"
needs = "`ch01/hello.lu` — the one genuinely missing file of the eight — AND a warm cache the fixture cannot carry: the transcript is the SECOND build's (`reused object`), while a staged copy starts cold because `.lu-cache/` is gitignored, and the key the line prints is the one the page itself tells the reader will differ"
filed = "wolf-book#29 §2 (premise sharpened at bs44)"
retires = "the ch01 fixture, a transcript respelled to do both builds, and a key the comparison can hold (a `samples-os.toml`-style declared line, or a `--verbose` that prints `reused` without the digest)"

[[declined]]
block = "principles/exercises/ch22/EXERCISES.md:114"
class = "file"
needs = "NOT a missing file. The block is exercise 22-11's D32 demonstration — an unmarked `widest.lu` joining `sum.lu`'s module, E0302 on `main`. A corpus `.lu` must carry `//! check:` and `//! phase:`, and `[conf.directive.standalone]` (D59) makes a file carrying both a standalone entry that never joins its directory's module, so the collision cannot be staged. Measured on wolf 0.2.12 and lupin 0.1.34: the pair runs clean, exit 0 both"
filed = "wolf-book#29 §2 (premise corrected at bs44)"
retires = "a corpus admission rule that can hold a non-standalone member. The `console,in(pkg/…)` escape hatch is NOT one today, and the reason is an ordering rather than a design: a corpus fence parses `in(…)` (`collect_corpus_console` carries `fi.in_fixture` through), but `console::check` runs the corpus admission gate against the real exercise directory BEFORE any staging, so the block is declined before the fixture is looked at — and if it got that far, `stage()` opens with `remove_dir_all(dir)` and would wipe the staged exercise tree the corpus lane had just put there. Two small fixes, one hole"

