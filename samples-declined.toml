# The declined-transcript ledger (bs41) — the third answer the corpus
# console lane can give about a block.
#
#   samples-pending.toml   "not yet, anywhere"
#   samples-os.toml        "not here, and here is exactly what here says"
#   samples-declined.toml  "not replayed at all, and here is what a
#                           replay of it would need"
#
# wolf-book#24 asked for two things and bs38 could only give the first:
# replay every exercise transcript, and name the ones it cannot. The
# naming was the runner's own — a sentence the RULE noticed ("`lupin`
# names no solution in this exercise directory"), which is true and
# says nothing about whether anyone looked. wolf-book#29 turned the
# remainder into a list by class; this file turns each entry of that
# list into a row, and the gate runs both ways:
#
#   * a corpus console block nothing replays, with no row here, FAILS
#     the samples lane. The book does not grow an unexplained hole.
#   * a row whose block REPLAYS now is stale and FAILS too, naming the
#     row to delete. A hole that closes is news.
#
# ONE DECLINE IS EXEMPT FROM BOTH DIRECTIONS, and the exemption is why
# `Decline::host_only` exists in xtask/src/console.rs: a block the unix
# lane replays and windows declines (a built binary, a linked `wolf
# build`) is a third of the matrix standing down, not a hole in the
# book. Those print as OFF-LANE and are never balanced against this
# file, which is what lets these same twenty rows hold on all three
# hosts while the raw decline COUNT differs (20 on macOS and linux, 28
# on windows at the bs41 pin).
#
# WHAT BS41 TOOK, and why these twenty are what is left. #29 sorted 48
# declined blocks into five classes. Twenty-eight of them came in:
#
#   * the 24 `conform-run` blocks. #29 read them as wanting the
#     `diagnostic,from(id)` lane, because `wolf conform-run` prints its
#     protocol verdict on stdout while the pages paste the diagnostic
#     from stderr. Measured at this pin, that is a fact about a STREAM
#     and not about a verb: drop the one JSON line addressed to the
#     machine and the rest of what the tool said is exactly what the
#     page prints. Six of the twenty-four were the interpreter's
#     (`lupin conform-run … --explore=N`), which has no protocol half at
#     all and has replayed in book blocks since the console lane
#     existed — they were caught by a guard written for the compiler's
#     shape.
#   * the 4 `wolf --explain E…` blocks, admitted as the one command
#     with no file behind it that the corpus rule takes: no input, no
#     disk, no phase, and a catalog `verify-docs` already compares in
#     both directions.
#
# The twenty below are the rest, and none of them is a rule that could
# be widened — each wants something that is not in this repository.

