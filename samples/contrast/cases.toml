# The C twins' declared runs — `cargo xtask contrast` compiles each `.c`
# file with `-std=c99 -Wall -Werror` and executes it against every case
# below, asserting stdout, stderr, and exit status byte-for-byte. Both
# streams default to empty, so an unexpected diagnostic fails the case.
#
# Every vendored `.c` file must appear here at least once: an unasserted
# C twin is a claim, and the side-by-side pages are made of claims about
# what the C costs. Outputs are pasted from real runs, never predicted.

# ---------------------------------------------------------------- count
# after K&R §1.5–1.6 (PERMISSIONS.md, K&R row 1)

[[case]]
file = "count.c"
name = "per-file rows and a total"
argv = ["one.txt", "two.txt"]
files = { "one.txt" = "the wolf runs\nthe moon watches\n", "two.txt" = "alone\n" }
exit = 0
stdout = """
       2       6      31 one.txt
       1       1       6 two.txt
       3       7      37 total
"""

[[case]]
file = "count.c"
name = "no names: the stream is stdin, and no total row"
stdin = "the wolf runs\n"
exit = 0
stdout = """
       1       3      14 -
"""

[[case]]
file = "count.c"
name = "one name: a row, still no total"
argv = ["only.txt"]
files = { "only.txt" = "one two three\nfour\n" }
exit = 0
stdout = """
       2       4      19 only.txt
"""

[[case]]
file = "count.c"
name = "a name that does not open: the sentinel int reaches the exit status"
argv = ["nope.txt"]
exit = 1
stderr = """
count: cannot open nope.txt
"""

# ------------------------------------------------------------------ rpn
# after K&R §4.3 (PERMISSIONS.md, K&R row 2)

[[case]]
file = "rpn.c"
name = "two expressions, one nested"
stdin = "2 3 +\n5 1 2 + 4 * + 3 -\n"
exit = 0
stdout = """
5
14
"""

[[case]]
file = "rpn.c"
name = "division by zero and an empty stack both land on `error`"
stdin = "7 0 /\n+\n"
exit = 0
stdout = """
error
error
"""
stderr = """
rpn: division by zero
rpn: stack empty
rpn: stack empty
"""

[[case]]
file = "rpn.c"
name = "a pushed zero and an underflowing pop are the same value"
stdin = "0\n"
exit = 0
stdout = """
0
"""

[[case]]
file = "rpn.c"
name = "negative operands parse, and `-` stays an operator"
stdin = "-3 -4 *\n10 -2 -\n"
exit = 0
stdout = """
12
12
"""

# ------------------------------------------------------------- wordtree
# after K&R §6.5 (PERMISSIONS.md, K&R row 3)

[[case]]
file = "wordtree.c"
name = "the alphabetized walk, with repeats counted"
stdin = "the wolf runs\nthe moon watches the wolf\n"
exit = 0
stdout = """
   1 moon
   1 runs
   3 the
   1 watches
   2 wolf
"""

[[case]]
file = "wordtree.c"
name = "case is folded, so one word is one node"
stdin = "Wolf wolf WOLF\n"
exit = 0
stdout = """
   3 wolf
"""

[[case]]
file = "wordtree.c"
name = "no words at all: an empty tree walks to nothing"
stdin = "\n"
exit = 0
stdout = ""

