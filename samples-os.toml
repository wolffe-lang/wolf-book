# The per-host expectation ledger (bs25) — the twin of
# samples-pending.toml, turned sideways.
#
# samples-pending.toml answers "not yet, anywhere". This file answers
# "not here, and here is exactly what here says instead". Both refuse
# the third answer, which is a skip: the book does not print a
# transcript it has not executed, and it does not execute a program
# without saying what came out.
#
# Two row kinds, both byte-exact and both enforced in both directions:
#
#   [[refusal]]   a SAMPLE the pinned toolchain refuses by name on one
#                 host. `exit` and `stderr` are the whole verdict. Wrong
#                 words are a FAIL — a refusal that changes its wording
#                 is news. A pass is a FLIP — the host grew the feature
#                 and the row goes in the pin-bump commit.
#
#   [[transcript]] a CONSOLE BLOCK whose tool text differs on one host.
#                 The block is still replayed and still byte-compared,
#                 against `expect` instead of against the page. If the
#                 host starts printing the book's own transcript, the
#                 row is stale and that is a hard error too.
#
# A row names the release or the issue that ends it. Rows for other
# hosts are inert, but every row's subject is checked for existence on
# EVERY lane, so a typo cannot hide on two thirds of the matrix.
#
# Both kinds landed at bs25, the sprint where the samples lane first
# executed in CI (run 33628773436, 2026-09-02): ubuntu and windows had
# never run, and the failures they found were not all one kind. The
# ubuntu 19 were environment and were fixed in the environment (the
# lane installs lld, ch01 §1.2 tells the reader why). The other six
# were not: they were true statements about a host at that pin. All six
# have since come true the other way and are gone — four at bs26 by
# FLIP, two at bs27 by staleness — and the two notes below say how. The
# file holds no row today, which is a measurement and not a milestone:
# it means every declared per-host difference this book found has been
# answered by the toolchain.

# THE FOUR CHAPTER-30 REFUSAL ROWS RETIRED HERE, at bs26 (2026-09-02),
# at the wolf 0.2.3 pin they were dated to and in the pin-bump commit,
# which is the rule they were written under. They were declared one
# sprint earlier against v0.2.2, the release that refused twenty-one
# corpus rows on windows by construct name; s60b built that host's task
# layer — Win32 workers on the kernel's own reserve-and-guard stacks, a
# WSAPoll reactor behind the s35 interface, SetConsoleCtrlHandler for
# signals — and v0.2.3 measures windows at macOS parity with no row
# refused by construct name at all.
#
# The rig said so before anything was deleted. On the windows lane at
# the new pin (run 33693011057, 2026-09-02), `cargo xtask samples`
# answered 455 passed / 5 pending / 0 failed / 4 FLIPS, and named every
# row:
#
#   samples: FLIP ch30/ex30-3: samples-os.toml declares `wolf-run(exit=0)`
#   refused on windows at this pin, and it now PASSES — the host grew the
#   feature; remove the row in the pin-bump commit (it was retiring at
#   wolf 0.2.3 (s60b — the windows task layer on VirtualAlloc stacks and
#   the IOCP reactor))
#
# — and the same line for ex30-4, ex30-5 and book/ch30/part-pargrep. A
# hard error naming the row to delete is the whole reason a declared
# outcome is worth more than a skip: a skip would have gone on passing
# quietly through the release that made it false. 455 + 4 = the 459 the
# other two hosts report, which is the arithmetic that says nothing else
# moved.
#
# The `[[refusal]]` machinery stays. There is nothing for it to hold on
# any host at this pin, and the next host that refuses something by name
# will be written down the same way.

# THE TWO ch23/ch25 TRANSCRIPT ROWS RETIRED HERE, at bs27 (2026-09-03),
# at the pin that made them false and in the pin-bump sprint, which is
# the rule they were written under. They were the last rows in this file
# and they were never a pin story: one binary spelled the same project's
# paths two ways — every diagnostic path in wolf is slash-normalized on
# windows, and `wolf add` and `wolf publish` handed `path.display()`
# straight to their status messages. Filed as wolf-lang#222 at bs25 by
# the samples lane the week it was first lit, held byte for byte at
# bs26, and answered at v0.2.4: every path a package verb prints —
# `add`, `rm`, `init`, `vendor`, `publish`, and their error lines — goes
# through the diagnostics' own spelling now.
#
# The rig said so before anything was deleted. On the windows lane at
# the new pin (run 33742585877, 2026-09-03), `cargo xtask samples`
# reported 459 passed / 5 pending / 2 failed and named both rows:
#
#   samples: FAIL book\ch23.md:117: this host now prints the book's own
#   transcript, so samples-os.toml's windows row for this block is stale
#   — wolf-lang#222 landed; remove the row
#
# — and the same line for book\ch25.md:141, followed by
#
#   samples: samples-os.toml: 2 row(s) apply to windows — 0 declared
#   refusal(s) and 0 declared transcript(s) held
#
# A declared outcome that goes stale is a hard error naming the row to
# delete. A skip would have gone on passing quietly through the release
# that made it false, on the one host nobody develops on. That is the
# whole argument for this file, and it has now made it twice: four rows
# at bs26 by FLIP, two here by staleness.
#
# This file is empty of rows and stays. Both kinds of machinery are
# live, both directions are enforced, and the next host that refuses
# something by name — or prints its own words where the book prints the
# book's — will be written down the same way.

# bs30 — THE FILE HAS A ROW AGAIN, and it is the first one whose refusal
# reaches the program as a D30 ROW rather than as a driver message.
#
# Chapter 33 §33.4 prints a prefork server: a parent binds one listener,
# hands it down with `os_spawn_with`, and a re-executed child picks it
# up with `net_adopt_listener` and serves on it. That is the shape s137
# added the calls for, and the chapter runs it rather than describing
# it. Two of the three lanes serve the handoff and the block passes
# there. Windows does not, and the refusal is BY NAME: the runtime's
# own windows suite measured that a socket marked inheritable and named
# to a re-executed child is not a usable socket in that child at all —
# `std::process::Command` publishes only stdio handles on that host —
# and that a windows SOCKET is not a small stable descriptor a parent
# can hand over by position, which is the numbering `[os.proc.inherit]`
# promises. So `os_spawn_with` answers `unsupported`, the block's `?`
# makes that the documented process outcome, and the program exits 1
# with the tag on stdout.
#
# THE ROW DECLARES STDOUT, which is new here and is why `Refusal` grew
# the field at this sprint. A row that named only stderr would have
# pinned an exit code and none of the words, because a propagated row
# never touches stderr — and "this host prints exactly this" is the
# whole doctrine of this file. The `stdout` field is optional and every
# older row shape still parses.
#
# The row retires when the crossing lands: wolf-lang#235 names the work
# (a `PROC_THREAD_ATTRIBUTE_HANDLE_LIST` spawn of the runtime's own,
# which `Command` cannot express). The day it does, this block passes on
# windows and the rig FLIPS the row rather than letting it pass quietly.
[[refusal]]
id = "book/ch33/part-prefork"
os = "windows"
exit = 1
stderr = ""
stdout = "error: unsupported"
retires = "the windows descriptor crossing (wolf-lang#235)"
note = "bs30, 2026-09-07: `os_spawn_with` with a non-empty inherit set is the `unsupported` row on this host — a socket there is not a descriptor a parent can hand over by position — so §33.4's prefork block runs on linux and macOS and is refused here, by name."

# CHAPTER 34'S WINDOWS ROWS (bs67, 2026-10-16). Signals, ids and the
# terminal are the surface Windows has least of, by the specification:
# `[os.signal.platform]` makes `os_signal_send`, `os_signal_number`,
# `os_signal_ignored` and `os_ppid` `unsupported` there after their shape
# rows, `[os.proc.ids]` the four id reads, and `[os.term]` every terminal
# call. So four of chapter 34's blocks and exercise 34-7 answer an
# `unsupported` row on this host, and the interpreter's refusal that
# §34.2 prints is, on Windows, the row itself. Each row below was found
# by the windows samples lane of PR #81 (run 38956581744, job
# 117160860322: `exited Some(1), expected 0` for four programs, the
# console's actual text, a FLIP for `window.lu` while it claimed no
# stdout) and its words are held by that lane on every run after. They
# retire only if Windows grows the call, which no ruling plans: they
# name the clause, not a release.

[[refusal]]
id = "book/ch34/s3"
os = "windows"
exit = 1
stderr = ""
stdout = """this process, nothing sent: unsupported
two meanings at once: invalid
an id nobody holds: unsupported
error: unsupported"""
