[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fancy-regex = "0.14"
mdbook = { version = "0.4", default-features = false, features = ["search"] }

[dev-dependencies]
tempfile = "3"
